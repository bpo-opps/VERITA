<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Tarefas Opps (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: menu lateral claro fixo + área de trabalho em cinza bem leve; no celular o menu vira gaveta,
   a nova tarefa vira botão flutuante e o card de tarefa ocupa a tela. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e4e8ef;
  --border-input: #8a94a6;
  --text: #121826;
  --text-muted: #5b6475;
  /* Marca Opps (manual de marca): laranja #FB4F14 e degradê #FBD200 -> #FF6A00.
     --brand pinta logo, destaques e gráficos; --accent é o tom legível para botões e links,
     derivado da cor da marca em applyAccent (main.js) para o texto passar no contraste. */
  --brand: #FB4F14;
  --brand-orange: #FF6A00;
  --brand-yellow: #FBD200;
  --brand-gradient: linear-gradient(90deg, var(--brand-yellow), var(--brand-orange) 55%, var(--brand));
  --hello-wash: linear-gradient(115deg, color-mix(in srgb, var(--brand-yellow) 16%, transparent), color-mix(in srgb, var(--brand) 10%, transparent) 45%, transparent 75%);
  --accent: var(--accent-light, #d2400f);
  --on-accent: var(--on-accent-light, #ffffff);
  --accent-soft: color-mix(in srgb, var(--brand) 12%, transparent);
  --danger: #b42318;
  --warning: #92400e;
  --success: #067647;
  --side-bg: #101828;
  --side-text: #cfd5df;
  --side-muted: #8b95a7;
  --side-hover: #1d2939;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .14);
  --col: #eef1f6;
  --avatar: #dfe4ec;
  --late-bg: #fef3f2;
  --high-border: #fedf89;
  --high-bg: #fffaeb;
  --adj: #6941c6;
  --adj-border: #d9d6fe;
  --adj-bg: #f4f3ff;
  --ok-border: #abefc6;
  --ok-bg: #ecfdf3;
  --scrim: rgba(16, 24, 40, .45);
  --toast-bg: #101828;
  --toast-fg: #ffffff;
  --s-todo: #475467; --s-todo-bg: #f2f4f7;
  --s-doing: #175cd3; --s-doing-bg: #eff8ff;
  --s-review: #6941c6; --s-review-bg: #f4f3ff;
  --s-overdue: #b42318; --s-overdue-bg: #fef3f2;
  --s-ontime: #067647; --s-ontime-bg: #ecfdf3;
  --s-late: #b54708; --s-late-bg: #fffaeb;
  --s-cancel: #667085; --s-cancel-bg: #eaecf0;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --side-w: 248px;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --hello-wash: linear-gradient(115deg, color-mix(in srgb, var(--brand) 16%, transparent), transparent 65%);
    --accent: var(--accent-dark, #ff7a45); --on-accent: var(--on-accent-dark, #111111); --accent-soft: color-mix(in srgb, var(--brand) 18%, transparent);
    --bg: #0c111b; --surface: #151b26; --surface-2: #19202c; --border: #263040; --border-input: #7c8799; --text: #e9edf3; --text-muted: #a1aab8;
    --danger: #f97066; --warning: #fdb022; --success: #47cd89;
    --side-bg: #080c14; --side-text: #cfd5df; --side-muted: #7e889a; --side-hover: #161d2a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
    --col: #111722; --avatar: #2c3546;
    --late-bg: #3a1714; --high-border: #7a5520; --high-bg: #2a2012; --adj: #bdb4fe; --adj-border: #4a3a7a; --adj-bg: #221c38;
    --ok-border: #1f6b45; --ok-bg: #0f2b1d; --scrim: rgba(0, 0, 0, .6); --toast-bg: #e9edf3; --toast-fg: #0c111b;
    --s-todo: #cbd5e1; --s-todo-bg: #222a36; --s-doing: #84caff; --s-doing-bg: #12263d; --s-review: #bdb4fe; --s-review-bg: #241d3a;
    --s-overdue: #fda29b; --s-overdue-bg: #3a1714; --s-ontime: #75e0a7; --s-ontime-bg: #0f2b1d; --s-late: #fec84b; --s-late-bg: #33240b;
    --s-cancel: #98a2b3; --s-cancel-bg: #242a33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --hello-wash: linear-gradient(115deg, color-mix(in srgb, var(--brand) 16%, transparent), transparent 65%);
  --accent: var(--accent-dark, #ff7a45); --on-accent: var(--on-accent-dark, #111111); --accent-soft: color-mix(in srgb, var(--brand) 18%, transparent);
  --bg: #0c111b; --surface: #151b26; --surface-2: #19202c; --border: #263040; --border-input: #7c8799; --text: #e9edf3; --text-muted: #a1aab8;
  --danger: #f97066; --warning: #fdb022; --success: #47cd89;
  --side-bg: #080c14; --side-text: #cfd5df; --side-muted: #7e889a; --side-hover: #161d2a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
  --col: #111722; --avatar: #2c3546;
  --late-bg: #3a1714; --high-border: #7a5520; --high-bg: #2a2012; --adj: #bdb4fe; --adj-border: #4a3a7a; --adj-bg: #221c38;
  --ok-border: #1f6b45; --ok-bg: #0f2b1d; --scrim: rgba(0, 0, 0, .6); --toast-bg: #e9edf3; --toast-fg: #0c111b;
  --s-todo: #cbd5e1; --s-todo-bg: #222a36; --s-doing: #84caff; --s-doing-bg: #12263d; --s-review: #bdb4fe; --s-review-bg: #241d3a;
  --s-overdue: #fda29b; --s-overdue-bg: #3a1714; --s-ontime: #75e0a7; --s-ontime-bg: #0f2b1d; --s-late: #fec84b; --s-late-bg: #33240b;
  --s-cancel: #98a2b3; --s-cancel-bg: #242a33;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
#app { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/20px var(--font); -webkit-font-smoothing: antialiased; }
h1 { font-size: 20px; line-height: 28px; margin: 0; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-size: 15px; line-height: 22px; margin: 0 0 10px; font-weight: 700; }
h3 { font-size: 13px; margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea {
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; background: var(--surface); min-height: 38px; width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
input:hover, select:hover, textarea:hover { border-color: var(--border-input); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[disabled], select[disabled] { opacity: .6; }
textarea { min-height: 80px; resize: vertical; }
label, .label { display: block; font-weight: 600; font-size: 13px; margin: 0 0 6px; color: var(--text); }
.field { margin-bottom: 14px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow, .grow { flex: 1; min-width: 0; }
.spacer { flex: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--text-muted); }
.small { font-size: 12px; line-height: 16px; }
.danger { color: var(--danger); }
.warn { color: var(--warning); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.empty { color: var(--text-muted); text-align: center; padding: 20px 8px; font-size: 13px; }
.error { color: var(--danger); margin: 8px 0; font-size: 13px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.confirm-text { margin: 0 0 16px; }

/* ---------- botões ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border); background: var(--surface);
  border-radius: var(--radius-sm); padding: 8px 14px; min-height: 38px; cursor: pointer; white-space: nowrap; font-weight: 600; box-shadow: var(--shadow);
  transition: background .15s, border-color .15s, filter .15s; }
.btn:hover { border-color: var(--border-input); background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { padding: 4px 10px; min-height: 30px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; filter: none; }
.btn svg, .nav-link svg, .icon-btn svg { width: 18px; height: 18px; flex: none; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); cursor: pointer; color: var(--text); }
.link { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--text); cursor: pointer; text-align: left; }
.link:hover { color: var(--accent); }
.file-btn { position: relative; }

/* ---------- estrutura: menu lateral + conteúdo ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100%; }
.sidebar { position: sticky; top: 0; height: 100vh; height: 100dvh; background: var(--surface); color: var(--text-muted); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 18px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); gap: 4px; overflow-y: auto; z-index: 30; }
.brand { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 8px 10px 16px; text-decoration: none; }
.brand-sub { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
.wordmark { height: 34px; width: auto; display: block; }
.dark-only { display: none !important; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .light-only { display: none !important; } :root:not([data-theme="light"]) .dark-only { display: block !important; } }
:root[data-theme="dark"] .light-only { display: none !important; }
:root[data-theme="dark"] .dark-only { display: block !important; }
/* Faixa fina no degradê da marca no topo da tela. */
.app::before { content: ""; position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; height: 3px; background: var(--brand-gradient); z-index: 35; pointer-events: none; }
.nav-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); padding: 12px 12px 6px; opacity: .8; }
.nav-link { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; color: var(--text-muted); text-decoration: none; font-weight: 600; }
.nav-link:hover { background: var(--surface-2); color: var(--text); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); box-shadow: inset 3px 0 0 var(--brand); }
.badge { margin-left: auto; display: inline-flex; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #f04438; color: #fff;
  font-size: 11px; font-weight: 700; align-items: center; justify-content: center; }
.side-user { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px; border-top: 1px solid var(--border); }
.side-user .who-name { font-weight: 600; color: var(--text); font-size: 13px; line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-user .who-role { font-size: 12px; color: var(--text-muted); }
.side-user .avatar { width: 34px; height: 34px; font-size: 12px; background: var(--accent-soft); color: var(--accent); border: 0; margin: 0; }
.side-user .icon-btn { margin-left: auto; }
.content { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; min-height: 64px; background: color-mix(in srgb, var(--surface) 90%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding-block: 10px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.topbar .menu-btn { display: none; }
.topbar .page-sub { color: var(--text-muted); font-size: 13px; }
main { padding-block: 20px 32px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); width: 100%; max-width: 1680px; }
.scrim { display: none; }

/* ---------- blocos ---------- */
.card-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
.section { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; }
.kpi .kpi-label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
.kpi .kpi-value { font-size: 24px; line-height: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi.alert .kpi-value { color: var(--danger); }
.kpi.good .kpi-value { color: var(--success); }

/* ---------- barra de filtros ---------- */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .search { position: relative; flex: 1 1 220px; max-width: 320px; }
.toolbar .search svg { position: absolute; left: 10px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
.toolbar .search input { padding-left: 34px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select { width: auto; max-width: 240px; }
.filters-toggle { display: none; }
.toolbar input[type=checkbox] { min-width: 0; width: 16px; min-height: 16px; }
.seg { display: inline-flex; background: var(--col); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  font: inherit; font-weight: 600; color: var(--text-muted); margin: 0; }
.seg-btn svg { width: 16px; height: 16px; }
.seg-btn[aria-pressed="true"], .seg-btn:has(input:checked) { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.seg-btn:has(input:focus-visible) { outline: 2px solid var(--accent); }
.check { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
.check input[type=checkbox], .checks input, .check.inline input { width: 16px; min-height: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.check .done { text-decoration: line-through; color: var(--text-muted); }
.check.inline { font-weight: 500; margin: 0; white-space: nowrap; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.checks label { font-weight: 500; display: flex; gap: 8px; align-items: center; margin: 0; }

/* ---------- quadro (kanban) ---------- */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(232px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
.col { background: var(--col); border-radius: var(--radius); padding: 10px; min-height: 220px; display: flex; flex-direction: column; gap: 8px; scroll-snap-align: start; }
.col.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.col-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 13px; padding: 4px 4px 2px; }
.col-head .count { color: var(--text-muted); font-weight: 600; background: var(--surface); border-radius: 999px; padding: 0 8px; font-size: 12px; line-height: 20px; }
.col-head > span:first-child::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; background: var(--s-todo); }
.col.col-doing .col-head > span:first-child::before { background: var(--s-doing); }
.col.col-review .col-head > span:first-child::before { background: var(--s-review); }
.col.col-overdue .col-head > span:first-child::before { background: var(--s-overdue); }
.col.col-done_on_time .col-head > span:first-child::before { background: var(--s-ontime); }
.col.col-done_late .col-head > span:first-child::before { background: var(--s-late); }
.col.col-cancelled .col-head > span:first-child::before { background: var(--s-cancel); }
.col.col-overdue { background: color-mix(in srgb, var(--s-overdue-bg) 45%, var(--col)); }
.col-note { margin: -2px 4px 2px; font-size: 12px; color: var(--text-muted); }
.task { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px;
  box-shadow: var(--shadow); cursor: pointer; font: inherit; color: inherit; transition: box-shadow .15s, transform .15s, border-color .15s; }
.task:hover { box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); transform: translateY(-1px); }
.task.dragging { opacity: .4; }
.task .title { font-weight: 700; margin-bottom: 8px; overflow-wrap: anywhere; line-height: 19px; }
.task.col-cancelled .title { text-decoration: line-through; color: var(--text-muted); }
.task-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; min-width: 0; }
.task-who { display: flex; gap: 6px; align-items: center; min-width: 0; font-size: 12px; color: var(--text-muted); }
.task-who .client { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; line-height: 16px; color: var(--text-muted); }
.tag { border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; background: var(--surface-2); white-space: nowrap; font-weight: 500; }
.tag.late { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: var(--late-bg); }
.tag.high, .tag.warn { color: var(--warning); border-color: var(--high-border); background: var(--high-bg); }
.tag.adj { color: var(--adj); border-color: var(--adj-border); background: var(--adj-bg); }
.tag.ok { color: var(--success); border-color: var(--ok-border); background: var(--ok-bg); }
.tag.internal { color: var(--s-review); border-color: color-mix(in srgb, var(--s-review) 35%, transparent); background: var(--s-review-bg); }
td .tag.internal { margin-left: 6px; }
.avatars { margin-left: auto; display: flex; padding-left: 6px; }
.avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--avatar); color: var(--text); font-size: 10px; font-weight: 700; display: inline-flex;
  align-items: center; justify-content: center; margin-left: -6px; border: 2px solid var(--surface); flex: none; }
.cancel-reason { margin: 0 0 8px; font-size: 12px; line-height: 16px; color: var(--text-muted); overflow-wrap: anywhere; }
.progress { display: flex; align-items: center; gap: 8px; margin: 2px 0 10px; }
.bar { flex: 1; height: 6px; background: var(--col); border-radius: 3px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--brand); border-radius: 3px; }
.progress .pct { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-muted); min-width: 34px; text-align: right; font-weight: 600; }
.pct-input { width: 76px; }

.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; line-height: 18px; font-weight: 600; white-space: nowrap; }
.pill.col-todo, .chip.col-todo { color: var(--s-todo); background: var(--s-todo-bg); }
.pill.col-doing, .chip.col-doing { color: var(--s-doing); background: var(--s-doing-bg); }
.pill.col-review, .chip.col-review { color: var(--s-review); background: var(--s-review-bg); }
.pill.col-overdue, .chip.col-overdue { color: var(--s-overdue); background: var(--s-overdue-bg); }
.pill.col-done_on_time, .chip.col-done_on_time { color: var(--s-ontime); background: var(--s-ontime-bg); }
.pill.col-done_late, .chip.col-done_late { color: var(--s-late); background: var(--s-late-bg); }
.pill.col-cancelled, .chip.col-cancelled { color: var(--s-cancel); background: var(--s-cancel-bg); }

/* ---------- logos ---------- */
.logo { flex: none; width: 24px; height: 24px; border-radius: 7px; object-fit: contain; background: var(--surface); border: 1px solid var(--border); }
.logo.xs { width: 16px; height: 16px; border-radius: 4px; }
.logo.md { width: 36px; height: 36px; border-radius: 10px; }
.logo.lg { width: 60px; height: 60px; border-radius: 14px; }
.logo.fallback { display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--text-muted); background: var(--surface-2); }
.logo.xs.fallback { font-size: 7px; }
.logo.md.fallback { font-size: 13px; }
.logo.lg.fallback { font-size: 20px; }
.with-logo { display: inline-flex; align-items: center; gap: 8px; }

/* ---------- tabelas ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
table.tasks .progress { margin: 0; min-width: 110px; }
.row-link { cursor: pointer; }
.row-link:hover td { background: var(--surface-2); }
td.actions { text-align: right; white-space: nowrap; }
td.actions > * { margin-left: 4px; }

/* ---------- calendário ---------- */
.calendar .cal-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.calendar .cal-nav h2 { margin: 0; min-width: 180px; text-align: center; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-dow { font-size: 12px; font-weight: 700; color: var(--text-muted); padding: 0 6px; text-transform: uppercase; letter-spacing: .04em; }
.cal-cell { min-height: 104px; border: 1px solid var(--border); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; background: var(--surface); }
.cal-cell.out { border-style: dashed; opacity: .35; background: transparent; }
.cal-cell.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal-day { font-size: 12px; font-weight: 700; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.cal-cell.today .cal-day { color: var(--accent); }
.chip { display: flex; align-items: center; gap: 4px; width: 100%; min-width: 0; border: 0; border-radius: 6px; padding: 3px 6px; font: inherit; font-size: 12px; line-height: 16px; cursor: pointer; text-align: left; font-weight: 500; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agenda { display: none; }
.agenda-day { padding: 10px 0; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.agenda-day h3 { margin: 0 0 2px; font-size: 13px; text-transform: capitalize; }
.agenda-day.today h3 { color: var(--accent); }
.no-due { margin-top: 14px; }
.chips { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-top: 8px; }

/* ---------- alertas ---------- */
.alert-row { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-top: 1px solid var(--border); background: none; padding: 12px 0; font: inherit; color: inherit; text-align: left; cursor: pointer; flex-wrap: wrap; }
.alert-row:first-of-type { border-top: 0; }
.alert-row .grow { flex: 1; min-width: 180px; }
.alert-row:hover strong { color: var(--accent); }

/* ---------- gaveta (detalhe) e diálogos ---------- */
.overlay { position: fixed; inset: 0; background: var(--scrim); display: flex; justify-content: flex-end; z-index: 50; animation: fade .15s ease-out; }
.overlay.center { justify-content: center; align-items: flex-start; padding-top: 8vh; z-index: 60; }
.drawer { background: var(--surface); width: min(680px, 100%); height: 100%; overflow-y: auto; padding: 22px 22px 0; box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; animation: slide .2s ease-out; }
.drawer-body { flex: 1 0 auto; padding-bottom: 16px; }
.drawer:focus { outline: none; }
.drawer-foot { position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--surface); border-top: 1px solid var(--border);
  margin: 0 -22px; padding: 12px 22px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
.drawer-head { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.drawer-head .grow { flex: 1; margin: 0; }
.title-input { font-size: 19px; font-weight: 700; flex: 1; border-color: transparent; padding-left: 6px; }
.title-input:hover { border-color: var(--border); }
.status-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin: 14px 0; }
.status-row .grow { flex: 1; min-width: 160px; }
.status-row .full { flex-basis: 100%; margin: 0; }
.main-fields { display: flex; flex-direction: column; gap: 2px; background: var(--surface-2); }
.main-fields .field { margin-bottom: 10px; }
.main-fields p { margin: 0; }
.modal { background: var(--surface); width: min(560px, calc(100% - 32px)); border-radius: 16px; padding: 22px; max-height: 84vh; overflow-y: auto; box-shadow: var(--shadow-lg); animation: pop .15s ease-out; }
.done-box { background: var(--s-ontime-bg); border-color: transparent; box-shadow: none; }
.cancel-box { background: var(--s-cancel-bg); border-color: transparent; box-shadow: none; }
.waiting-box { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.waiting-box .link { color: var(--accent); }
.comment { padding: 10px 0; border-bottom: 1px solid var(--border); }
.comment:last-child { border-bottom: 0; }
.comment .by { font-weight: 700; color: var(--text); }
.comment .body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; }
.adj-item { padding: 10px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 8px; }
.adj-item.open { border-color: var(--adj-border); background: var(--adj-bg); }
.ck-text { font-weight: 400; margin: 0; flex: 1; overflow-wrap: anywhere; }
.cl-builder { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 4px; }
.cl-builder li { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
.cl-builder li .grow { flex: 1; overflow-wrap: anywhere; }
.roles { padding-left: 18px; margin: 8px 0 12px; }
.roles li { margin-bottom: 4px; }
details > summary { cursor: pointer; font-weight: 600; }

/* ---------- login ---------- */
.login-wrap { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px var(--gutter-r) 24px var(--gutter-l);
  background: radial-gradient(900px 500px at 0% 0%, color-mix(in srgb, var(--brand-yellow) 22%, transparent), transparent),
    radial-gradient(900px 600px at 100% 100%, color-mix(in srgb, var(--brand) 20%, transparent), transparent), var(--bg); }
.login { position: relative; overflow: hidden; width: min(400px, 100%); background: var(--surface); padding: 32px 28px 28px; border-radius: 18px; border: 1px solid var(--border); box-shadow: var(--shadow-lg); }
.login::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--brand-gradient); }
.login-brand { margin-bottom: 18px; }
.login-brand .wordmark { height: 46px; }
.login h1 { margin-bottom: 4px; }
.login .btn.primary { width: 100%; margin-top: 8px; }

#toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%) translateY(8px); background: var(--toast-bg); color: var(--toast-fg);
  padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 80; box-shadow: var(--shadow-lg); max-width: calc(100% - 32px); }
#toast.show { opacity: 1; transform: translateX(-50%); }

@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateX(24px); opacity: .6; } }
@keyframes pop { from { transform: scale(.98); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- painel ---------- */
.dash { display: flex; flex-direction: column; gap: 16px; }
.hello { position: relative; overflow: hidden; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 22px; border-radius: 16px; border: 1px solid var(--border);
  background: var(--hello-wash), var(--surface); box-shadow: var(--shadow); }
.hello::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--brand-gradient); }
.hello-date { margin: 0; color: var(--text-muted); font-size: 13px; }
.hello-title { font-size: 22px; line-height: 30px; margin: 2px 0 0; letter-spacing: -.01em; }
.hello-chips { display: grid; grid-template-columns: repeat(4, minmax(0, auto)); gap: 8px; }
.hchip { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; min-width: 128px; }
.hchip-icon { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-muted); flex: none; }
.hchip-icon svg { width: 18px; height: 18px; }
.hchip.good .hchip-icon { background: var(--s-ontime-bg); color: var(--s-ontime); }
.hchip.bad .hchip-icon { background: var(--s-overdue-bg); color: var(--s-overdue); }
.hchip.warn .hchip-icon { background: var(--high-bg); color: var(--warning); }
.hchip-label { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); }
.hchip-value { font-size: 20px; line-height: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hchip.bad .hchip-value { color: var(--danger); }
.hchip-sub { font-size: 11px; color: var(--text-muted); }
.dash-filters { display: flex; gap: 8px; flex-wrap: wrap; }
.dash-filters select { width: auto; }
.dash-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.panel-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.panel-head h2 { margin: 0; }
.panel-head p { margin: 2px 0 0; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--border); border-radius: 12px; padding: 14px 10px; text-align: center; background: var(--surface-2); }
.stat-value { font-size: 24px; line-height: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat.good .stat-value { color: var(--success); }
.stat.bad .stat-value { color: var(--danger); }
.stat-label { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }
.stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hbar { display: grid; grid-template-columns: minmax(90px, 38%) minmax(0, 1fr) 44px; gap: 10px; align-items: center; border-radius: 6px; }
.hbar:focus-visible { outline-offset: 4px; }
.hbar-label { display: flex; gap: 6px; align-items: center; font-size: 13px; min-width: 0; }
.hbar-label > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-track { height: 14px; background: var(--col); border-radius: 0 4px 4px 0; overflow: hidden; display: block; }
.hbar-fill { display: block; height: 100%; background: var(--brand); border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar-fill.col-todo { background: var(--s-todo); }
.hbar-fill.col-doing { background: var(--s-doing); }
.hbar-fill.col-review { background: var(--s-review); }
.hbar-fill.col-overdue { background: var(--s-overdue); }
.hbar-fill.col-done_on_time { background: var(--s-ontime); }
.hbar-fill.col-done_late { background: var(--s-late); }
.hbar-fill.col-cancelled { background: var(--s-cancel); }
.hbar-value { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13px; }
.cols-chart { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; height: 190px; align-items: end; border-bottom: 1px solid var(--border); padding-bottom: 0; }
.colc { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; position: relative; padding-bottom: 20px; }
.colc-bar { width: min(24px, 70%); background: linear-gradient(180deg, var(--brand-orange), var(--brand)); border-radius: 4px 4px 0 0; display: block; }
.colc-value { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.colc-label { position: absolute; bottom: 2px; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.load { display: flex; flex-direction: column; gap: 10px; }
.load-row { display: grid; grid-template-columns: 28px minmax(80px, 30%) minmax(0, 1fr) auto; gap: 10px; align-items: center; border-radius: 6px; }
.load-row .avatar { margin: 0; width: 28px; height: 28px; }
.load-name { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.load-nums { display: flex; gap: 10px; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chart-tip { position: fixed; z-index: 90; background: var(--toast-bg); color: var(--toast-fg); font-size: 12px; line-height: 16px; padding: 6px 10px; border-radius: 8px;
  pointer-events: none; max-width: 280px; box-shadow: var(--shadow-lg); }
.card-box h2 .with-logo svg { width: 18px; height: 18px; color: var(--accent); }

.notice-body { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; max-height: 50vh; overflow: auto; }

/* ---------- tablet ---------- */
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dash-grid { grid-template-columns: minmax(0, 1fr); }
  .hello-chips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ---------- celular ---------- */
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; inset: 0 auto 0 0; border-right: 0; width: min(290px, 84vw); transform: translateX(-102%); transition: transform .2s ease-out; box-shadow: var(--shadow-lg);
    padding-top: max(18px, env(safe-area-inset-top, 0px)); }
  .app.nav-open .sidebar { transform: none; }
  .app.nav-open .scrim { display: block; position: fixed; inset: 0; background: var(--scrim); z-index: 25; }
  /* Sem desfoque no celular: backdrop-filter faria o botão flutuante se posicionar pela barra, não pela tela. */
  .topbar { min-height: 56px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); top: env(safe-area-inset-top, 0px); backdrop-filter: none; background: var(--surface); }
  .topbar .menu-btn { display: inline-flex; }
  .topbar h1 { font-size: 17px; }
  .topbar .new-task { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40;
    width: 56px; height: 56px; border-radius: 18px; padding: 0; box-shadow: var(--shadow-lg); }
  .topbar .new-task .label-text { display: none; }
  .topbar .new-task svg { width: 24px; height: 24px; }
  main { padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 14px 96px; }
  .kpis { gap: 8px; }
  .kpi { padding: 10px 12px; }
  .kpi .kpi-value { font-size: 20px; line-height: 26px; }
  .toolbar .search { max-width: none; flex-basis: 100%; order: 3; }
  .filters-toggle { display: inline-flex; }
  .filters { display: none; flex-basis: 100%; order: 4; }
  .filters.open { display: grid; grid-template-columns: 1fr 1fr; }
  .filters select, .filters .check.inline { max-width: none; width: 100%; }
  .board { grid-auto-columns: 82vw; scroll-snap-type: x mandatory; margin-right: calc(-1 * var(--gutter-r)); padding-right: var(--gutter-r); }
  .grid3 { grid-template-columns: 1fr 1fr; }
  .drawer { width: 100%; padding: 16px var(--gutter-r) 0 var(--gutter-l); padding-top: max(16px, env(safe-area-inset-top, 0px)); }
  .drawer-foot { margin: 0 calc(-1 * var(--gutter-r)) 0 calc(-1 * var(--gutter-l)); padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  .drawer-foot .btn { flex: 1; }
  .overlay.center { align-items: flex-end; padding: 0; }
  .modal { width: 100%; border-radius: 18px 18px 0 0; max-height: 92vh; padding-bottom: max(22px, env(safe-area-inset-bottom, 0px)); }
  .cal-grid, .cal-dow { display: none; }
  .agenda { display: block; }
  /* Lista vira cards */
  table.tasks thead { display: none; }
  table.tasks, table.tasks tbody, table.tasks tr, table.tasks td { display: block; width: 100%; }
  table.tasks tr { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--surface); }
  table.tasks td { border: 0; padding: 3px 0; display: flex; gap: 12px; justify-content: space-between; align-items: center; text-align: right; }
  table.tasks td::before { content: attr(data-label); color: var(--text-muted); font-size: 12px; font-weight: 600; text-align: left; }
  table.tasks td:first-child { display: block; text-align: left; padding-bottom: 6px; }
  table.tasks td:first-child::before { content: none; }
  table.tasks .progress { min-width: 140px; }
  .card-box { padding: 14px; }
}
@media (max-width: 640px) {
  .hello { padding: 16px; }
  .hello-chips { width: 100%; }
  .hchip { min-width: 0; padding: 8px 10px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .load-row { grid-template-columns: 28px minmax(0, 1fr) auto; }
  .load-row .hbar-track { grid-column: 2 / -1; grid-row: 2; }
  .cols-chart { gap: 4px; }
  .colc-label { font-size: 10px; }
}
@media (max-width: 420px) {
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .filters.open { grid-template-columns: 1fr; }
}
.choice-list { display: grid; gap: 8px; margin-bottom: 12px; }
.choice-list .btn { justify-content: space-between; text-align: left; width: 100%; }

/* reuniões */
.sub-h { font-size: 14px; margin: 14px 0 6px; }
.meeting-head .people { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.meeting-head .summary { margin: 0 0 12px; color: var(--text); line-height: 1.5; }
.section-h { margin: 18px 0 6px; align-items: center; }
.section-h h2 { margin: 0; font-size: 16px; }
.item-card { border-left: 3px solid var(--accent); }
.item-card .quote { margin: -4px 0 12px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); font-size: 13px; line-height: 1.45; }
.reading { display: flex; gap: 10px; align-items: center; }
.spinner { width: 18px; height: 18px; flex: none; border-radius: 50%; border: 2.5px solid var(--border); border-top-color: var(--accent); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
.error-box { border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: var(--late-bg); }
.add-item { flex-wrap: nowrap; }
.add-item input { min-width: 0; }
.plain-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.plain-list li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
.item-grid textarea { min-height: 0; }
@media (max-width: 860px) { .item-grid { grid-template-columns: 1fr; } }

/* colunas criadas, anexos, cliente responsável */
.col[class*="col-stage-"] .col-head > span:first-child::before { background: var(--s-doing); }
.pill[class*="col-stage-"], .chip[class*="col-stage-"] { color: var(--s-doing); background: var(--s-doing-bg); }
.hbar-fill[class*="col-stage-"] { background: var(--s-doing); }
.avatar.client { background: var(--surface-2); color: var(--text-muted); border: 1px dashed var(--border-input); }
.board-cols { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.board-cols li { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); flex-wrap: wrap; }
.board-cols li.fixed { background: var(--surface-2); }
.attach-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.attach-list li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px solid var(--border); }
.attach-list .link { text-align: left; overflow-wrap: anywhere; }
.attach-list .link { flex: 1 1 100%; }
.who-did { margin: 4px 0 0; font-size: 12px; color: var(--text-muted); }
.who-did.detail { margin: -4px 0 12px; }
.who-did.detail:empty { display: none; }
.vis-rows { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 6px; }
.vis-rows label[hidden] { display: none; }
.alert-row-wrap { border-top: 1px solid var(--border); }
.alert-row-wrap:first-of-type { border-top: 0; }
.alert-row-wrap .alert-row { border-top: 0; padding-bottom: 6px; }
.row-tools { display: flex; gap: 6px; padding: 0 0 10px 52px; flex-wrap: wrap; }
.wa-box { border-left: 3px solid #25d366; }
.wa-text { width: 100%; font: inherit; font-size: 14px; line-height: 1.45; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-input); background: var(--surface-2); color: var(--text); resize: vertical; margin-bottom: 10px; }
.wa-img { width: 100%; max-height: 60vh; object-fit: contain; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
.clickable { cursor: pointer; font: inherit; color: inherit; text-align: left; }
button.hchip, button.stat, button.hbar, button.colc, button.load-row { border-style: solid; width: 100%; }
button.hbar, button.colc, button.load-row { background: none; border: 0; padding: 0; }
button.colc { padding-bottom: 20px; }
a.btn { text-decoration: none; }
.hchip.clickable:hover, .stat.clickable:hover { border-color: var(--accent); }
.hbar.clickable:hover .hbar-label, .load-row.clickable:hover .load-name { color: var(--accent); text-decoration: underline; }
.colc.clickable:hover .colc-bar { filter: brightness(1.1); }
.dash-filter-note { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-left: 3px solid var(--accent); }
button.stat.clickable { text-align: center; }
/* relatórios */
.rep-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-bottom: 14px; }
.rep-card { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font: inherit; color: inherit; cursor: pointer; }
.rep-card:hover { border-color: var(--accent); }
.rep-card.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--hello-wash, var(--surface)); }
.rep-filters { margin-bottom: 12px; }
.rep-date { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); }
.rep-actions { align-items: center; flex-wrap: wrap; }
.rep-table td { vertical-align: top; }
@media (max-width: 640px) { .rep-picker { grid-template-columns: 1fr 1fr; } .rep-card .muted { display: none; } }
/* compromissos */
.ev-day { padding: 4px 0 10px; border-top: 1px solid var(--border); }
.ev-day:first-child { border-top: 0; }
.ev-day h3 { font-size: 13px; margin: 10px 0 6px; color: var(--text-muted); }
.ev-day.today h3 { color: var(--accent); }
.ev-item { display: flex; gap: 12px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 6px; font: inherit; color: inherit; cursor: pointer; flex-wrap: wrap; }
.ev-item:hover { background: var(--surface-2); }
.ev-time { min-width: 92px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
.ev-chip { color: var(--s-review); background: var(--s-review-bg); }
.cal-add { margin-top: auto; align-self: flex-end; border: 0; background: none; color: var(--text-muted); font-size: 16px; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 6px; opacity: .5; }
.cal-add:hover { opacity: 1; background: var(--surface-2); }
.grid3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 0 12px; }
@media (max-width: 480px) { .grid3 { grid-template-columns: 1fr 1fr; } .grid3 > :first-child { grid-column: 1 / -1; } }
.notes-box summary { cursor: pointer; font-weight: 600; } .notes-box textarea { width: 100%; }

#demo-bar { position: relative; z-index: 45; background: #0b0f17; color: #ffffff; padding-block: 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
#demo-bar strong { margin-right: 4px; }
@media (min-width: 861px) { .sidebar { height: calc(100dvh - 44px); } }
#demo-bar span { color: #c5cad1; flex: 1; min-width: 200px; }
#demo-bar button { background: transparent; color: #ffffff; border: 1px solid #6b7280; border-radius: 6px; padding: 3px 10px; cursor: pointer; font: inherit; }
#demo-bar button:hover { background: #2a2f37; }
</style>
</head>

  <button type="button" data-as="admin">Entrar como administrador</button>
  <button type="button" data-as="member">Entrar como equipe Opps</button>
  <button type="button" data-as="client">Entrar como cliente</button>
  <button type="button" data-reset>Restaurar dados</button>
</div>

<script>
'use strict';
// Regras de negócio usadas pelo servidor (require) e pelo navegador (window.Shared):
// colunas do quadro, alertas de prazo, recorrência, % de execução e quem vê cada tarefa.
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Shared = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  const STATUSES = ['todo', 'doing', 'review', 'done', 'cancelled'];
  const STATUS_LABEL = { todo: 'A fazer', doing: 'Em andamento', review: 'Em revisão', done: 'Concluída', cancelled: 'Cancelada' };

  const COLUMNS = [
    { key: 'todo', name: 'A fazer' },
    { key: 'doing', name: 'Em andamento' },
    { key: 'review', name: 'Em revisão' },
    { key: 'overdue', name: 'Atrasada' },
    { key: 'done_on_time', name: 'Concluída no prazo' },
    { key: 'done_late', name: 'Concluída fora do prazo' },
    { key: 'cancelled', name: 'Cancelada' },
  ];

  const ALERTS = [
    { days: 0, label: 'No dia do prazo' },
    { days: 1, label: '1 dia antes' },
    { days: 3, label: '3 dias antes' },
    { days: 7, label: '1 semana antes' },
  ];
  const ALERT_DAYS = ALERTS.map(a => a.days);

  const RECURRENCE = {
    none: 'Não repete', daily: 'Diária', weekly: 'Semanal', biweekly: 'Quinzenal', monthly: 'Mensal',
    bimonthly: 'Bimestral', quarterly: 'Trimestral', four_monthly: 'Quadrimestral', semiannual: 'Semestral',
    yearly: 'Anual', custom: 'Livre (a cada N dias)',
  };
  const STEP = {
    daily: { days: 1 }, weekly: { days: 7 }, biweekly: { days: 14 }, monthly: { months: 1 }, bimonthly: { months: 2 },
    quarterly: { months: 3 }, four_monthly: { months: 4 }, semiannual: { months: 6 }, yearly: { months: 12 },
  };

  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };

  // Data de hoje no fuso de quem está usando (no servidor, o fuso do processo: defina TZ).
  function today(now = new Date()) {
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  }
  function addDays(s, n) { const d = parse(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); }
  // Soma meses sem pular mês: 31/01 + 1 mês = 28/02 (ou 29/02).
  function addMonths(s, n) {
    const d = parse(s);
    const day = d.getUTCDate();
    d.setUTCDate(1);
    d.setUTCMonth(d.getUTCMonth() + n);
    const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
    d.setUTCDate(Math.min(day, last));
    return iso(d);
  }
  function daysBetween(a, b) { return Math.round((parse(b) - parse(a)) / 864e5); }

  function nextDate(s, recurrence, every) {
    if (!s) return null;
    if (recurrence === 'custom') return addDays(s, Math.max(1, Number(every) || 1));
    const step = STEP[recurrence];
    if (!step) return null;
    return step.days ? addDays(s, step.days) : addMonths(s, step.months);
  }

  // Coluna do quadro: concluída no prazo ou fora dele pela data de término; atrasada é automática.
  // Tarefa numa coluna criada pela organização: status "doing" com stage_id (chave "stage-<id>").
  function column(t, now = today()) {
    if (t.status === 'cancelled') return 'cancelled';
    if (t.status === 'done') {
      return !t.due_date || (t.completed_on && t.completed_on <= t.due_date) ? 'done_on_time' : 'done_late';
    }
    if (t.due_date && t.due_date < now) return 'overdue';
    if (t.status === 'doing' && t.stage_id) return `stage-${t.stage_id}`;
    return t.status;
  }

  // Colunas do quadro na ordem da organização. A fazer e Em andamento ficam sempre no começo;
  // as outras (inclusive as criadas) seguem `order`; o que não estiver na ordem entra no fim.
  const FIXED = ['todo', 'doing'];
  function boardColumns(stages = [], order = []) {
    const all = COLUMNS.map(c => ({ ...c, custom: false }))
      .concat(stages.map(st => ({ key: `stage-${st.id}`, name: st.name, custom: true, stage_id: st.id })));
    const movable = all.filter(c => !FIXED.includes(c.key));
    const rank = k => { const i = (order || []).indexOf(k); return i < 0 ? 1e6 + movable.findIndex(c => c.key === k) : i; };
    return all.filter(c => FIXED.includes(c.key)).concat(movable.sort((a, b) => rank(a.key) - rank(b.key)));
  }

  const PRIORITY_RANK = { high: 0, normal: 1, low: 2 };
  function boardSort(a, b) {
    if (a.due_date !== b.due_date) {
      if (!a.due_date) return 1;
      if (!b.due_date) return -1;
      return a.due_date < b.due_date ? -1 : 1;
    }
    return (PRIORITY_RANK[a.priority] ?? 1) - (PRIORITY_RANK[b.priority] ?? 1) || a.id - b.id;
  }

  // Alerta ativo: atrasada, ou dentro da janela de algum aviso escolhido.
  function alert(t, now = today()) {
    if (t.status === 'done' || t.status === 'cancelled' || t.archived_at || !t.due_date) return null;
    const left = daysBetween(now, t.due_date);
    if (left < 0) return { kind: 'overdue', days: left };
    const offsets = Array.isArray(t.alerts) ? t.alerts : [];

    return null;
  }
  function alertText(a) {
    if (!a) return '';
    if (a.kind === 'overdue') return a.days === -1 ? 'Venceu ontem' : `Venceu há ${-a.days} dias`;
    if (a.days === 0) return 'Vence hoje';
    if (a.days === 1) return 'Vence amanhã';
    return `Vence em ${a.days} dias`;
  }

  // % de execução: com checklist, segue o checklist; sem checklist, o valor informado.
  function progress(t, checklistTotal, checklistDone) {
    if (t.status === 'done') return 100;
    if (checklistTotal > 0) return Math.round((checklistDone / checklistTotal) * 100);
    return Math.max(0, Math.min(100, Number(t.progress) || 0));
  }

  // Marcar um item do checklist numa tarefa A fazer é começar: vai para Em andamento e, sem início, começa hoje.
  // Devolve o que mudar na tarefa, ou null.
  function startByChecklist(t, day) {
    if (t.status !== 'todo') return null;
