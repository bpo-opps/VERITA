<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarefas (protótipo)</title>
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --border: #e2e5e9;
  --border-input: #858d97;
  --text: #15181d;
  --text-muted: #5a636e;
  --accent: #0f766e;
  --on-accent: #ffffff;
  --danger: #b42318;
  --warning: #92400e;
  --success: #166534;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);
  --col: #eceef1;
  --avatar: #d7dbe0;
  --late-bg: #fff5f4;
  --high-border: #f0c78a;
  --high-bg: #fffaf0;
  --adj: #6b21a8;
  --adj-border: #d8b4fe;
  --adj-bg: #faf5ff;
  --ok-border: #a7d7b5;
  --ok-bg: #f2fbf4;
  --scrim: rgba(16,24,40,.35);
  --toast-bg: #15181d;
  --toast-fg: #ffffff;
  --s-todo: #475467; --s-todo-bg: #f2f4f7;
  --s-doing: #175cd3; --s-doing-bg: #eff8ff;
  --s-review: #6941c6; --s-review-bg: #f4f3ff;
  --s-overdue: #b42318; --s-overdue-bg: #fef3f2;
  --s-ontime: #067647; --s-ontime-bg: #ecfdf3;
  --s-late: #b54708; --s-late-bg: #fffaeb;
  --s-cancel: #667085; --s-cancel-bg: #eaecf0;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --surface: #1a1e24; --border: #2c323a; --border-input: #78818c; --text: #e8eaed; --text-muted: #a3abb5;
    --danger: #f97066; --warning: #f5b454; --success: #6fcf8f;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --col: #161a1f; --avatar: #343b44;
    --late-bg: #2a1614; --high-border: #7a5520; --high-bg: #2a2012; --adj: #d6b4fe; --adj-border: #6b4a92; --adj-bg: #231a2e;
    --ok-border: #2f6b45; --ok-bg: #12241a; --scrim: rgba(0,0,0,.55); --toast-bg: #e8eaed; --toast-fg: #111418;
    --s-todo: #cbd5e1; --s-todo-bg: #232a33; --s-doing: #84caff; --s-doing-bg: #13263d; --s-review: #c4b5fd; --s-review-bg: #241d3a;
    --s-overdue: #fda29b; --s-overdue-bg: #3a1714; --s-ontime: #75e0a7; --s-ontime-bg: #0f2b1d; --s-late: #fec84b; --s-late-bg: #33240b; --s-cancel: #98a2b3; --s-cancel-bg: #262b33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --surface: #1a1e24; --border: #2c323a; --border-input: #78818c; --text: #e8eaed; --text-muted: #a3abb5;
  --danger: #f97066; --warning: #f5b454; --success: #6fcf8f;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --col: #161a1f; --avatar: #343b44;
  --late-bg: #2a1614; --high-border: #7a5520; --high-bg: #2a2012; --adj: #d6b4fe; --adj-border: #6b4a92; --adj-bg: #231a2e;
  --ok-border: #2f6b45; --ok-bg: #12241a; --scrim: rgba(0,0,0,.55); --toast-bg: #e8eaed; --toast-fg: #111418;
  --s-todo: #cbd5e1; --s-todo-bg: #232a33; --s-doing: #84caff; --s-doing-bg: #13263d; --s-review: #c4b5fd; --s-review-bg: #241d3a;
  --s-overdue: #fda29b; --s-overdue-bg: #3a1714; --s-ontime: #75e0a7; --s-ontime-bg: #0f2b1d; --s-late: #fec84b; --s-late-bg: #33240b; --s-cancel: #98a2b3; --s-cancel-bg: #262b33;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/20px var(--font); }
h1 { font-size: 20px; line-height: 28px; margin: 0; }
h2 { font-size: 16px; line-height: 24px; margin: 0 0 8px; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea {
  border: 1px solid var(--border-input); border-radius: 6px; padding: 6px 8px; background: var(--surface); min-height: 32px; width: 100%;
}
textarea { min-height: 72px; resize: vertical; }
label { display: block; font-weight: 500; margin: 0 0 4px; }
.field { margin-bottom: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 160px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn { border: 1px solid var(--border-input); background: var(--surface); border-radius: 6px; padding: 6px 12px; min-height: 32px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(.95); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 2px 8px; min-height: 26px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

header.top { background: var(--surface); border-bottom: 1px solid var(--border); padding-block: 0; padding-left: var(--gutter-l); padding-right: var(--gutter-r); display: flex; align-items: center; gap: 16px; min-height: 52px; flex-wrap: wrap; }
.brand { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.brand .dot { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); }
nav.main { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; }
nav.main a { white-space: nowrap; text-decoration: none; color: var(--text-muted); padding: 6px 10px; border-radius: 6px; }
nav.main a[aria-current="page"] { color: var(--text); background: var(--bg); font-weight: 600; }
.who { color: var(--text-muted); display: flex; gap: 8px; align-items: center; }

main { padding-block: 16px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); max-width: 1600px; margin: 0 auto; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar select, .toolbar input { width: auto; min-width: 140px; }
.card-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.muted { color: var(--text-muted); }
.empty { color: var(--text-muted); text-align: center; padding: 24px 8px; }

.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(184px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--col); border-radius: var(--radius); padding: 8px; min-height: 200px; display: flex; flex-direction: column; gap: 8px; }
.col.over { outline: 2px dashed var(--accent); }
.col-head { display: flex; justify-content: space-between; font-weight: 600; padding: 4px 4px 0; }
.col-head .count { color: var(--text-muted); font-weight: 400; }
.task { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; box-shadow: var(--shadow); cursor: pointer; }
.task:hover { border-color: var(--border-input); }
.task.dragging { opacity: .4; }
.task .title { font-weight: 600; margin-bottom: 6px; overflow-wrap: anywhere; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; line-height: 16px; color: var(--text-muted); }
.tag { border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; background: var(--bg); }
.tag.late { color: var(--danger); border-color: var(--danger); background: var(--late-bg); }
.tag.high { color: var(--warning); border-color: var(--high-border); background: var(--high-bg); }
.tag.adj { color: var(--adj); border-color: var(--adj-border); background: var(--adj-bg); }
.tag.ok { color: var(--success); border-color: var(--ok-border); background: var(--ok-bg); }
.avatars { margin-left: auto; display: flex; padding-left: 6px; }
.avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--avatar); color: var(--text); font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-left: 2px; }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-muted); font-weight: 600; font-size: 13px; }
.table-wrap { overflow-x: auto; }

.overlay { position: fixed; inset: 0; background: var(--scrim); display: flex; justify-content: flex-end; z-index: 10; }
.overlay.center { justify-content: center; align-items: flex-start; padding-top: 8vh; }
.drawer { background: var(--surface); width: min(640px, 100%); height: 100%; overflow-y: auto; padding: 20px; box-shadow: -8px 0 24px rgba(0,0,0,.18); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); }
.modal { background: var(--surface); width: min(520px, calc(100% - 32px)); border-radius: 12px; padding: 20px; max-height: 84vh; overflow-y: auto; }
.drawer-head { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 16px; }
.drawer-head input { font-size: 18px; font-weight: 700; border-color: transparent; }
.drawer-head input:hover, .drawer-head input:focus { border-color: var(--border-input); }
.section { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
.check { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
.check input[type=checkbox] { width: 16px; min-height: 16px; height: 16px; }
.check .done { text-decoration: line-through; color: var(--text-muted); }
.checks { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.checks label { font-weight: 400; display: flex; gap: 6px; align-items: center; margin: 0; }
.checks input { width: 16px; min-height: 16px; }
.comment { padding: 8px 0; border-bottom: 1px solid var(--border); }
.comment:last-child { border-bottom: 0; }
.comment .by { font-weight: 600; }
.comment .body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
.adj-item { padding: 8px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 8px; }
.adj-item.open { border-color: var(--adj-border); background: var(--adj-bg); }
.bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 6px 0 0; }
.bar > span { display: block; height: 100%; background: var(--accent); }

.portal-section { margin-bottom: 24px; }
.portal-task { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 8px; }
.portal-task.waiting { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

.login { max-width: 360px; margin: 12vh auto; background: var(--surface); padding: 24px; border-radius: 12px; border: 1px solid var(--border); }
.error { color: var(--danger); margin: 8px 0; }
#toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--toast-bg); color: var(--toast-fg); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
#toast.show { opacity: 1; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.confirm-text { margin: 0 0 16px; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
@media (max-width: 640px) {
  header.top { gap: 4px 12px; padding-block: 8px 0; }
  .who { margin-left: auto; }
  nav.main { order: 3; flex: 0 0 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; }
}

/* ---------- v2: tipos, situações, visões ---------- */
.spacer { flex: 1; }
.small { font-size: 12px; line-height: 16px; }
.danger { color: var(--danger); }
.warn { color: var(--warning); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.label { display: block; font-weight: 500; margin: 0 0 4px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 560px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.check.inline { font-weight: 400; margin: 0; gap: 6px; white-space: nowrap; }
.toolbar select { flex: 0 1 auto; }

.logo { flex: none; width: 24px; height: 24px; border-radius: 6px; object-fit: contain; background: var(--surface); border: 1px solid var(--border); }
.logo.xs { width: 16px; height: 16px; border-radius: 4px; }
.logo.md { width: 32px; height: 32px; border-radius: 8px; }
.logo.lg { width: 56px; height: 56px; border-radius: 12px; }
.logo.fallback { display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--text-muted); background: var(--bg); }
.logo.xs.fallback { font-size: 7px; }
.logo.md.fallback { font-size: 12px; }
.logo.lg.fallback { font-size: 18px; }
.brand .logo { width: 22px; height: 22px; }
.with-logo { display: inline-flex; align-items: center; gap: 8px; }

.badge { display: inline-flex; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px; border-radius: 999px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; align-items: center; justify-content: center; }

.seg { display: inline-flex; border: 1px solid var(--border-input); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg-btn { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font: inherit; color: var(--text-muted); margin: 0; font-weight: 500; }
.seg-btn + .seg-btn { border-left: 1px solid var(--border); }
.seg-btn[aria-pressed="true"], .seg-btn:has(input:checked) { background: var(--accent); color: var(--on-accent); }
.seg-btn:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }

.task-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; min-width: 0; }
.task-who { display: flex; gap: 6px; align-items: center; min-width: 0; font-size: 12px; color: var(--text-muted); }
.task-who .client { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag.internal { color: var(--s-review); border-color: currentColor; background: var(--s-review-bg); }
.tag.warn { color: var(--warning); border-color: var(--high-border); background: var(--high-bg); }
.col-note { margin: -4px 4px 0; font-size: 12px; color: var(--text-muted); }

.progress { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; }
.progress .bar { flex: 1; margin: 0; }
.progress .pct { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-muted); min-width: 32px; text-align: right; }
.pct-input { width: 72px; }

.pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 12px; line-height: 18px; font-weight: 600; white-space: nowrap; }
.pill.col-todo { color: var(--s-todo); background: var(--s-todo-bg); }
.pill.col-doing { color: var(--s-doing); background: var(--s-doing-bg); }
.pill.col-review { color: var(--s-review); background: var(--s-review-bg); }
.pill.col-overdue { color: var(--s-overdue); background: var(--s-overdue-bg); }
.pill.col-done_on_time { color: var(--s-ontime); background: var(--s-ontime-bg); }
.pill.col-done_late { color: var(--s-late); background: var(--s-late-bg); }
.col-head > span:first-child::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: middle; background: var(--s-todo); }
.col.col-doing .col-head > span:first-child::before { background: var(--s-doing); }
.col.col-review .col-head > span:first-child::before { background: var(--s-review); }
.col.col-overdue .col-head > span:first-child::before { background: var(--s-overdue); }
.col.col-done_on_time .col-head > span:first-child::before { background: var(--s-ontime); }
.col.col-done_late .col-head > span:first-child::before { background: var(--s-late); }
.col.col-overdue { background: var(--s-overdue-bg); }

table.tasks td { vertical-align: middle; }
table.tasks .progress { margin: 0; min-width: 110px; }
.row-link { cursor: pointer; }
.row-link:hover td { background: var(--bg); }
.link { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--text); cursor: pointer; text-align: left; }
.link:hover { color: var(--accent); }
td.actions { text-align: right; white-space: nowrap; }
td.actions > * { margin-left: 4px; }
.file-btn { display: inline-flex; align-items: center; position: relative; }

.calendar .cal-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.calendar .cal-nav h2 { margin: 0; min-width: 170px; text-align: center; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 0 4px; }
.cal-cell { min-height: 96px; border: 1px solid var(--border); border-radius: 6px; padding: 4px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cal-cell.out { border-style: dashed; opacity: .4; }
.cal-cell.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal-day { font-size: 12px; font-weight: 600; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.chip { display: flex; align-items: center; gap: 4px; width: 100%; min-width: 0; border: 0; border-radius: 4px; padding: 2px 4px; font: inherit; font-size: 12px; line-height: 16px; cursor: pointer; text-align: left; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.col-todo { color: var(--s-todo); background: var(--s-todo-bg); }
.chip.col-doing { color: var(--s-doing); background: var(--s-doing-bg); }
.chip.col-review { color: var(--s-review); background: var(--s-review-bg); }
.chip.col-overdue { color: var(--s-overdue); background: var(--s-overdue-bg); }
.chip.col-done_on_time { color: var(--s-ontime); background: var(--s-ontime-bg); }
.chip.col-done_late { color: var(--s-late); background: var(--s-late-bg); }
.agenda { display: none; }
.agenda-day { padding: 8px 0; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
.agenda-day h3 { margin: 0 0 4px; font-size: 13px; text-transform: capitalize; }
.agenda-day.today h3 { color: var(--accent); }
.no-due { margin-top: 12px; }
.chips { display: grid; gap: 4px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-top: 8px; }
@media (max-width: 640px) { .cal-grid, .cal-dow { display: none; } .agenda { display: block; } }

.alert-row { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-top: 1px solid var(--border); background: none; padding: 10px 0; font: inherit; color: inherit; text-align: left; cursor: pointer; flex-wrap: wrap; }
.alert-row:first-of-type { border-top: 0; }
.alert-row .grow { flex: 1; min-width: 180px; }
.done-box { background: var(--s-ontime-bg); border-color: transparent; }
.drawer-head { align-items: center; }
.roles { padding-left: 18px; margin: 8px 0 12px; }
.roles li { margin-bottom: 4px; }
.toolbar input[type=checkbox] { min-width: 0; width: 16px; min-height: 16px; }
td .tag.internal { margin-left: 6px; }
.pill.col-cancelled, .chip.col-cancelled { color: var(--s-cancel); background: var(--s-cancel-bg); }
.col.col-cancelled .col-head > span:first-child::before { background: var(--s-cancel); }
.task.col-cancelled .title { text-decoration: line-through; color: var(--text-muted); }
.cancel-reason { margin: 0 0 8px; font-size: 12px; line-height: 16px; color: var(--text-muted); overflow-wrap: anywhere; }
.cancel-box { background: var(--s-cancel-bg); border-color: transparent; }
.cancel-box .reason { white-space: pre-wrap; overflow-wrap: anywhere; }
.cl-builder { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 4px; }
.cl-builder li { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; }
.cl-builder li .grow { flex: 1; overflow-wrap: anywhere; }
.tag { white-space: nowrap; }
.board { gap: 8px; }

#demo-bar { background: #15181d; color: #ffffff; padding-block: 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
#demo-bar strong { margin-right: 4px; }
#demo-bar span { color: #c5cad1; flex: 1; min-width: 200px; }
#demo-bar button { background: transparent; color: #ffffff; border: 1px solid #6b7280; border-radius: 6px; padding: 3px 10px; cursor: pointer; font: inherit; }
#demo-bar button:hover { background: #2a2f37; }
</style>
</head>
<body>
<div id="demo-bar" role="region" aria-label="Protótipo">
  <strong>Protótipo</strong>
  <span>Dados fictícios, salvos só neste navegador. Senha de todos: demo1234.</span>
  <button type="button" data-as="admin">Entrar como administrador</button>
  <button type="button" data-as="member">Entrar como equipe Opps</button>
  <button type="button" data-as="client">Entrar como cliente</button>

<script>
'use strict';
// Regras de negócio usadas pelo servidor (require) e pelo navegador (window.Shared):
// colunas do quadro, alertas de prazo, recorrência, % de execução e quem vê cada tarefa.
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Shared = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  const STATUSES = ['todo', 'doing', 'review', 'done', 'cancelled'];
  const STATUS_LABEL = { todo: 'A fazer', doing: 'Em andamento', review: 'Em revisão', done: 'Concluída', cancelled: 'Cancelada' };

  const COLUMNS = [
    { key: 'todo', name: 'A fazer' },
    { key: 'doing', name: 'Em andamento' },
    { key: 'review', name: 'Em revisão' },
    { key: 'overdue', name: 'Atrasada' },
    { key: 'done_on_time', name: 'Concluída no prazo' },
    { key: 'done_late', name: 'Concluída fora do prazo' },
    { key: 'cancelled', name: 'Cancelada' },
  ];

  const ALERTS = [
    { days: 0, label: 'No dia do prazo' },
    { days: 1, label: '1 dia antes' },
    { days: 3, label: '3 dias antes' },
    { days: 7, label: '1 semana antes' },
  ];
  const ALERT_DAYS = ALERTS.map(a => a.days);

  const RECURRENCE = {
    none: 'Não repete', daily: 'Diária', weekly: 'Semanal', biweekly: 'Quinzenal', monthly: 'Mensal',
    bimonthly: 'Bimestral', quarterly: 'Trimestral', four_monthly: 'Quadrimestral', semiannual: 'Semestral',
    yearly: 'Anual', custom: 'Livre (a cada N dias)',
  };
  const STEP = {
    daily: { days: 1 }, weekly: { days: 7 }, biweekly: { days: 14 }, monthly: { months: 1 }, bimonthly: { months: 2 },
    quarterly: { months: 3 }, four_monthly: { months: 4 }, semiannual: { months: 6 }, yearly: { months: 12 },
  };

  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };

  // Data de hoje no fuso de quem está usando (no servidor, o fuso do processo: defina TZ).
  function today(now = new Date()) {
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  }
  function addDays(s, n) { const d = parse(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); }
  // Soma meses sem pular mês: 31/01 + 1 mês = 28/02 (ou 29/02).
  function addMonths(s, n) {
    const d = parse(s);
    const day = d.getUTCDate();
    d.setUTCDate(1);
    d.setUTCMonth(d.getUTCMonth() + n);
    const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
    d.setUTCDate(Math.min(day, last));
    return iso(d);
  }
  function daysBetween(a, b) { return Math.round((parse(b) - parse(a)) / 864e5); }

  function nextDate(s, recurrence, every) {
    if (!s) return null;
    if (recurrence === 'custom') return addDays(s, Math.max(1, Number(every) || 1));
    const step = STEP[recurrence];
    if (!step) return null;
    return step.days ? addDays(s, step.days) : addMonths(s, step.months);
  }

  // Coluna do quadro: concluída no prazo ou fora dele pela data de término; atrasada é automática.
  function column(t, now = today()) {
    if (t.status === 'cancelled') return 'cancelled';
    if (t.status === 'done') {
      return !t.due_date || (t.completed_on && t.completed_on <= t.due_date) ? 'done_on_time' : 'done_late';
    }
    if (t.due_date && t.due_date < now) return 'overdue';
    return t.status;
  }

  // Alerta ativo: atrasada, ou dentro da janela de algum aviso escolhido.
  function alert(t, now = today()) {
    if (t.status === 'done' || t.status === 'cancelled' || t.archived_at || !t.due_date) return null;
    const left = daysBetween(now, t.due_date);
    if (left < 0) return { kind: 'overdue', days: left };
    const offsets = Array.isArray(t.alerts) ? t.alerts : [];
    if (offsets.some(o => left <= o)) return { kind: 'soon', days: left };
    return null;
  }
  function alertText(a) {
    if (!a) return '';
    if (a.kind === 'overdue') return a.days === -1 ? 'Venceu ontem' : `Venceu há ${-a.days} dias`;
    if (a.days === 0) return 'Vence hoje';
    if (a.days === 1) return 'Vence amanhã';
    return `Vence em ${a.days} dias`;
  }

  // % de execução: com checklist, segue o checklist; sem checklist, o valor informado.
  function progress(t, checklistTotal, checklistDone) {
    if (t.status === 'done') return 100;
    if (checklistTotal > 0) return Math.round((checklistDone / checklistTotal) * 100);
    return Math.max(0, Math.min(100, Number(t.progress) || 0));
  }

  // O cliente vê a tarefa? Externa sempre; interna só se estiver ligada a ele e marcada como visível.
  function clientSees(t) {
    return !!t.client_id && (t.kind === 'external' || !!t.client_visible);
  }
  // Quem vê a tarefa. Externa: a equipe toda. Interna: só quem criou e os responsáveis
  // (vale também para administradores). Cliente: as da empresa dele que clientSees permite.
  function canSee(user, t, assigneeIds) {
    if (user.role === 'client') return t.client_id === user.client_id && clientSees(t);
    if (t.kind === 'external') return true;
    return t.created_by === user.id || assigneeIds.includes(user.id);
  }

  function validAlerts(list) {
    if (!Array.isArray(list) || !list.every(n => ALERT_DAYS.includes(Number(n)))) return null;
    return [...new Set(list.map(Number))].sort((a, b) => a - b);
  }

  return { STATUSES, STATUS_LABEL, COLUMNS, ALERTS, ALERT_DAYS, RECURRENCE, today, addDays, addMonths, daysBetween, nextDate, column, alert, alertText, progress, clientSees, canSee, validAlerts };
});

<script>
'use strict';
/* global Shared */
// API do protótipo: a mesma interface do servidor (app.js), rodando dentro do navegador.

(function () {
  const S = window.Shared;
  const KEY = 'tarefas-prototipo-v3';
  const now = () => new Date().toISOString().slice(0, 19).replace('T', ' ');
  const d = n => S.addDays(S.today(), n);

  function seed() {

    };
    task({ kind: 'external', client: 1, title: 'Levantar processos do financeiro', due: d(5), alerts: [1, 3] }, [2]);
    task({ kind: 'external', client: 1, status: 'doing', title: 'Mapear fluxo de contas a pagar', start: d(-4), due: d(2), progress: 40 }, [2, 1]);
    task({ kind: 'external', client: 2, status: 'doing', title: 'Fechamento contábil de setembro', start: d(-6), due: d(1), alerts: [0, 1, 3], recurrence: 'monthly', priority: 'high' }, [3],
      [['Conciliar bancos', true], ['Conferir notas fiscais', true], ['Lançar provisões', false], ['Enviar relatório ao cliente', false]]);
    const rev = task({ kind: 'external', client: 1, status: 'review', title: 'Relatório de diagnóstico', start: d(-10), due: d(3), progress: 90 }, [1]);
    db.comments.push({ id: 1, task_id: rev, user_id: 1, body: 'Versão 1 pronta para sua revisão.', visible_to_client: 1, created_at: now() });
    task({ kind: 'external', client: 2, status: 'doing', title: 'Conciliação bancária de agosto', start: d(-12), due: d(-2), progress: 70 }, [2]);
    task({ kind: 'external', client: 2, status: 'done', title: 'Reunião de kickoff', start: d(-16), due: d(-14), done: d(-15) }, [1]);
    task({ kind: 'external', client: 1, status: 'done', title: 'Cadastro de fornecedores', start: d(-12), due: d(-9), done: d(-6) }, [2]);
    task({ kind: 'external', client: 2, status: 'cancelled', title: 'Treinamento do sistema de ponto', due: d(4), cancelled: d(-1), reason: 'Cliente decidiu trocar de sistema de ponto antes do treinamento.' }, [3]);
    task({ kind: 'internal', title: 'Planejamento comercial do trimestre', due: d(10), alerts: [7], recurrence: 'quarterly' }, []);
    task({ kind: 'internal', client: 1, visible: true, status: 'doing', title: 'Preparar proposta de renovação da Padaria', start: d(-1), due: d(6), progress: 30, by: 2 }, [2]);
    task({ kind: 'internal', client: 1, status: 'doing', title: 'Revisar margem do contrato da Padaria', due: d(0), progress: 20, alerts: [0], by: 2 }, [2]);
    task({ kind: 'internal', title: 'Atualizar modelo de relatório mensal', due: d(15), by: 3 }, [3]);
    task({ kind: 'external', client: 2, status: 'done', title: 'Levantamento inicial (antigo)', due: d(-40), done: d(-41), archived: true }, [1]);
    db.templates.push({ id: 1, name: 'Fechamento mensal', title: 'Fechamento do mês', description: '',
      checklist: ['Conciliar bancos', 'Conferir notas fiscais', 'Lançar provisões', 'Enviar relatório ao cliente'] });
    return db;
  }

  let db;
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch { db = null; }
  if (!db) db = seed();
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { /* sem armazenamento: fica só na memória */ } };
  let sessionUser = null;
  try { sessionUser = Number(sessionStorage.getItem(KEY + '-user')) || null; } catch { /* idem */ }
  const setSession = uid => { sessionUser = uid; try { uid ? sessionStorage.setItem(KEY + '-user', uid) : sessionStorage.removeItem(KEY + '-user'); } catch { /* idem */ } };
  const nextId = () => ++db.seq;

  class HttpError extends Error { constructor(status, message) { super(message); this.status = status; } }
  const fail = (s, m) => { throw new HttpError(s, m); };
  const str = (v, field, { max = 500, required = true } = {}) => {
    if (v === undefined || v === null || v === '') { if (required) fail(400, `Campo obrigatório: ${field}`); return ''; }

    const s = v.trim();
    if (required && !s) fail(400, `Campo obrigatório: ${field}`);
    if (s.length > max) fail(400, `Campo muito longo: ${field} (máx. ${max})`);

  };

  const logo = v => { if (v === null || v === '') return null; if (!/^data:image\/(png|jpeg|webp);base64,/.test(v)) fail(400, 'Logo inválido'); if (v.length > 300 * 1024) fail(400, 'Logo grande demais'); return v; };
  const isStaff = u => u.role !== 'client';
  const requireStaff = u => { if (!isStaff(u)) fail(403, 'Sem permissão'); };
  const requireAdmin = u => { if (u.role !== 'admin') fail(403, 'Só administradores'); };

  const clientOf = cid => db.clients.find(c => c.id === cid);
  const userName = uid => (db.users.find(u => u.id === uid) || {}).name;
  const assigneeIds = tid => db.assignees.filter(a => a.task_id === tid).map(a => a.user_id);
  function loadTask(user, tid) {
    const t = db.tasks.find(x => x.id === tid);
    if (!t || !S.canSee(user, t, assigneeIds(t.id)) || (user.role === 'client' && t.archived_at)) fail(404, 'Tarefa não encontrada');
    return t;
  }
  function checkClient(cid) { if (!clientOf(cid)) fail(400, 'Cliente inválido'); }
  function checkAssignees(ids) {
    if (!Array.isArray(ids)) fail(400, 'Campo inválido: responsáveis');
    const clean = [...new Set(ids.map(Number))];
    for (const uid of clean) { const u = db.users.find(x => x.id === uid); if (!u || u.role === 'client' || !u.active) fail(400, 'Responsável inválido'); }
    return clean;
  }
  const setAssignees = (tid, ids) => { db.assignees = db.assignees.filter(a => a.task_id !== tid).concat(ids.map(user_id => ({ task_id: tid, user_id }))); };
  const touch = t => { t.updated_at = now(); };
  function kindAndClient(kind, cid) {
    if (kind === 'external' && !cid) fail(400, 'Tarefa externa precisa de um cliente');
    if (cid) checkClient(cid);
    return cid || null;
  }
  function recurrence(body, cur = {}) {
    const rec = oneOf(body.recurrence, 'repetição', Object.keys(S.RECURRENCE), cur.recurrence || 'none');
    let every = null;
    if (rec === 'custom') {
      every = Number(body.recurrence_every ?? cur.recurrence_every);
      if (!Number.isInteger(every) || every < 1 || every > 3650) fail(400, 'Repetição livre: informe a cada quantos dias (1 a 3650)');
    }
    return { rec, every };
  }
  const alerts = v => { const a = S.validAlerts(v); if (!a) fail(400, 'Alertas inválidos'); return a; };
  const clientVisible = (kind, cid, flag) => (kind === 'internal' && cid && flag ? 1 : 0);
  const checklistItems = v => {
    if (v === undefined) return null;
    if (!Array.isArray(v)) fail(400, 'Checklist inválido');
    return v.map(x => str(x, 'item do checklist', { max: 300, required: false })).filter(Boolean).slice(0, 100);
  };

  function completeTask(t, completedOn, userId) {
    if (completedOn > S.today()) fail(400, 'A data de término não pode ser no futuro');
    if (t.start_date && completedOn < t.start_date) fail(400, 'A data de término não pode ser antes do início');
    Object.assign(t, { status: 'done', completed_on: completedOn, cancelled_on: null, cancel_reason: null, progress: 100 }); touch(t);
    if (t.recurrence === 'none' || t.next_task_id) return null;
    const nid = nextId();
    db.tasks.push({ ...t, id: nid, status: 'todo', completed_on: null, progress: 0, next_task_id: null, archived_at: null,
      start_date: null, due_date: S.nextDate(t.due_date || completedOn, t.recurrence, t.recurrence_every),
      position: Math.max(0, ...db.tasks.map(x => x.position)) + 1, created_by: t.created_by ?? userId, created_at: now(), updated_at: now() });
    setAssignees(nid, assigneeIds(t.id));
    db.checklist.filter(i => i.task_id === t.id).forEach(i => db.checklist.push({ ...i, id: nextId(), task_id: nid, done: 0 }));
    t.next_task_id = nid;
    return nid;
  }

  function decorate(user, t) {
    const cl = db.checklist.filter(i => i.task_id === t.id);
    const adj = db.adjustments.filter(a => a.task_id === t.id);
    const out = {
      id: t.id, kind: t.kind, client_id: t.client_id, client_name: t.client_id ? clientOf(t.client_id).name : null, client_visible: S.clientSees(t), status: t.status,
      column: S.column(t), title: t.title, start_date: t.start_date, due_date: t.due_date, completed_on: t.completed_on,
      cancelled_on: t.cancelled_on, cancel_reason: t.cancel_reason,
      progress: S.progress(t, cl.length, cl.filter(i => i.done).length), progress_from_checklist: cl.length > 0, priority: t.priority,
      alerts: t.alerts, alert: S.alert(t), recurrence: t.recurrence, recurrence_every: t.recurrence_every,
      position: t.position, archived_at: t.archived_at, created_by: t.created_by, updated_at: t.updated_at,
      checklist_total: cl.length, checklist_done: cl.filter(i => i.done).length,
      adjustments_client: adj.filter(a => a.origin === 'client').length, adjustments_internal: adj.filter(a => a.origin === 'internal').length,

      assignees: db.assignees.filter(a => a.task_id === t.id).map(a => ({ id: a.user_id, name: userName(a.user_id) })).sort((a, b) => a.name.localeCompare(b.name)),

    if (user.role === 'client') { delete out.adjustments_internal; delete out.created_by; }
    return out;
  }
  function detail(user, tid) {
    const t = loadTask(user, tid);
    const client = user.role === 'client';

      ...decorate(user, t), description: t.description, next_task_id: t.next_task_id,
      checklist: db.checklist.filter(i => i.task_id === t.id).sort((a, b) => a.position - b.position || a.id - b.id).map(({ id, text, done }) => ({ id, text, done })),
      comments: db.comments.filter(c => c.task_id === t.id && (!client || c.visible_to_client)).map(c => {
        const u = db.users.find(x => x.id === c.user_id) || {};
        return { id: c.id, body: c.body, visible_to_client: c.visible_to_client, created_at: c.created_at, author: u.name, author_role: u.role };
      }),
      adjustments: db.adjustments.filter(a => a.task_id === t.id && (!client || a.origin === 'client'))
        .map(a => ({ id: a.id, origin: a.origin, body: a.body, created_at: a.created_at, resolved_at: a.resolved_at, author: userName(a.user_id) })),
    };
  }
  function list(user, q) {
    const today = S.today();
    let ts = db.tasks.filter(t => S.canSee(user, t, assigneeIds(t.id)));
    if (user.role === 'client') ts = ts.filter(t => !t.archived_at);
    else {
      ts = ts.filter(t => (q.archived === '1' ? t.archived_at : !t.archived_at));
      if (q.kind) ts = ts.filter(t => t.kind === q.kind);
      if (q.client_id === 'org') ts = ts.filter(t => !t.client_id);
      else if (q.client_id) ts = ts.filter(t => t.client_id === Number(q.client_id));
    }
    const who = q.mine === '1' ? user.id : (q.assignee ? Number(q.assignee) : null);
    if (who) ts = ts.filter(t => assigneeIds(t.id).includes(who));
    if (q.due === 'overdue') ts = ts.filter(t => t.due_date && t.due_date < today && !['done', 'cancelled'].includes(t.status));
    if (q.due === 'today') ts = ts.filter(t => t.due_date === today);
    if (q.due === 'week') ts = ts.filter(t => t.due_date && t.due_date >= today && t.due_date <= S.addDays(today, 7));
    if (q.due === 'month') ts = ts.filter(t => t.due_date && t.due_date.slice(0, 7) === today.slice(0, 7));
    if (q.due === 'none') ts = ts.filter(t => !t.due_date);
    if (q.q) ts = ts.filter(t => t.title.toLowerCase().includes(String(q.q).toLowerCase()));
    return ts.sort((a, b) => a.position - b.position || a.id - b.id).map(t => decorate(user, t));
  }

  const routes = [];
  const route = (method, pattern, handler, pub = false) => {
    routes.push({ method, re: new RegExp('^' + pattern.replace(/:id/g, '(\\d+)') + '$'), handler, pub });
  };

  route('POST', '/api/login', ({ body }) => {
    const email = str(body.email, 'email', { max: 200 }).toLowerCase();
    str(body.password, 'senha', { max: 200 });
    const u = db.users.find(x => x.email === email && x.active);
    // No protótipo, as contas de exemplo usam demo1234; as criadas aqui usam a senha definida ao criar.
    if (!u || body.password !== (u.password || 'demo1234')) fail(401, 'Email ou senha incorretos');
    setSession(u.id);
    return { ok: true };
  }, true);
  route('POST', '/api/logout', () => { setSession(null); return { ok: true }; });
  route('GET', '/api/me', ({ user }) => ({
    user: { id: user.id, org_id: 1, name: user.name, email: user.email, role: user.role, client_id: user.client_id },
    org: db.org, today: S.today(),
  }));
  route('POST', '/api/me/password', ({ user, body }) => {
    const cur = str(body.current, 'senha atual'), next = str(body.password, 'nova senha');
    if (next.length < 8) fail(400, 'A nova senha precisa ter pelo menos 8 caracteres');
    if (cur !== (user.password || 'demo1234')) fail(400, 'Senha atual incorreta');
    user.password = next; return { ok: true };
  });
  route('PATCH', '/api/org', ({ user, body }) => {
    requireAdmin(user);
    if ('name' in body) db.org.name = str(body.name, 'nome', { max: 80 });
    if ('accent' in body) { const a = str(body.accent, 'cor', { max: 7 }); if (!/^#[0-9a-fA-F]{6}$/.test(a)) fail(400, 'Cor inválida (use #RRGGBB)'); db.org.accent = a; }
    if ('logo' in body) db.org.logo = logo(body.logo);
    return { ok: true };
  });
  route('GET', '/api/clients', ({ user }) => {
    if (user.role === 'client') return db.clients.filter(c => c.id === user.client_id).map(({ id, name, logo: l }) => ({ id, name, logo: l }));
    const open = (cid, kind) => db.tasks.filter(t => t.client_id === cid && t.kind === kind && !['done', 'cancelled'].includes(t.status) && !t.archived_at).length;
    return db.clients.map(c => ({ id: c.id, name: c.name, logo: c.logo, open_external: open(c.id, 'external'), open_internal: open(c.id, 'internal') }))
      .sort((a, b) => a.name.localeCompare(b.name));
  });
  route('POST', '/api/clients', ({ user, body }) => {
    requireAdmin(user);
    const id = nextId(); db.clients.push({ id, name: str(body.name, 'nome', { max: 120 }), logo: body.logo ? logo(body.logo) : null }); return { id };
  });
  route('PATCH', '/api/clients/:id', ({ user, body, id }) => {
    requireAdmin(user); checkClient(id);
    if ('name' in body) clientOf(id).name = str(body.name, 'nome', { max: 120 });
    if ('logo' in body) clientOf(id).logo = logo(body.logo);
    return { ok: true };
  });
  route('GET', '/api/users', ({ user }) => {
    requireStaff(user);
    const order = { admin: 0, client: 1, member: 2 };
    return db.users.map(u => ({ id: u.id, name: u.name, email: u.email, role: u.role, client_id: u.client_id, client_name: u.client_id ? clientOf(u.client_id).name : null, active: u.active }))
      .sort((a, b) => order[a.role] - order[b.role] || a.name.localeCompare(b.name));
  });
  route('POST', '/api/users', ({ user, body }) => {
    requireAdmin(user);
    const name = str(body.name, 'nome', { max: 120 });
    const email = str(body.email, 'email', { max: 200 }).toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) fail(400, 'Email inválido');
    const password = str(body.password, 'senha', { max: 200 });
    if (password.length < 8) fail(400, 'A senha precisa ter pelo menos 8 caracteres');
    const role = oneOf(body.role, 'papel', ['admin', 'member', 'client']);
    let client_id = null;
    if (role === 'client') { client_id = Number(body.client_id); checkClient(client_id); }
    if (db.users.some(u => u.email === email)) fail(409, 'Já existe um usuário com esse email');
    const id = nextId(); db.users.push({ id, name, email, role, client_id, active: 1, password }); return { id };
  });
  route('PATCH', '/api/users/:id', ({ user, body, id }) => {
    requireAdmin(user);
    const u = db.users.find(x => x.id === id); if (!u) fail(404, 'Usuário não encontrado');
    if (id === user.id) fail(400, 'Você não pode desativar a própria conta');
    u.active = body.active ? 1 : 0; return { ok: true };
  });
  route('GET', '/api/tasks', ({ user, query }) => list(user, query));
  route('GET', '/api/alerts', ({ user }) => list(user, {}).filter(t => t.alert).sort((a, b) => a.alert.days - b.alert.days));
  route('POST', '/api/tasks', ({ user, body }) => {
    requireStaff(user);
    if (body.kind === undefined) fail(400, 'Escolha se a tarefa é interna ou externa');
    const kind = oneOf(body.kind, 'tipo', ['internal', 'external']);
    const client_id = kindAndClient(kind, body.client_id ? Number(body.client_id) : null);
    let title = str(body.title, 'título', { max: 200, required: !body.template_id });
    let description = str(body.description, 'descrição', { max: 10000, required: false });
    let checklist = checklistItems(body.checklist);
    if (body.template_id) {
      const tpl = db.templates.find(t => t.id === Number(body.template_id)); if (!tpl) fail(400, 'Modelo inválido');
      title = title || tpl.title; description = description || tpl.description; checklist = checklist ?? tpl.checklist;
    }
    checklist = checklist || [];
    const due = date(body.due_date, 'Prazo');
    const { rec, every } = recurrence(body);
    const assignees = checkAssignees(body.assignee_ids || []);
    const id = nextId();
    db.tasks.push({ id, kind, client_id, client_visible: clientVisible(kind, client_id, body.client_visible), status: 'todo', title, description,
      start_date: null, due_date: due, completed_on: null, cancelled_on: null, cancel_reason: null, progress: 0,
      priority: oneOf(body.priority, 'prioridade', ['low', 'normal', 'high'], 'normal'), alerts: body.alerts === undefined ? [1] : alerts(body.alerts),
      recurrence: rec, recurrence_every: every, next_task_id: null, position: Math.max(0, ...db.tasks.map(t => t.position)) + 1,
      created_by: user.id, created_at: now(), updated_at: now(), archived_at: null });
    setAssignees(id, assignees);
    checklist.forEach((text, i) => db.checklist.push({ id: nextId(), task_id: id, text, done: 0, position: i }));
    return { id };
  });
  route('GET', '/api/tasks/:id', ({ user, id }) => detail(user, id));
  route('PATCH', '/api/tasks/:id', ({ user, body, id }) => {
    requireStaff(user);
    const t = loadTask(user, id);
    const copy = { ...t };
    try {
      if ('title' in body) t.title = str(body.title, 'título', { max: 200 });
      if ('description' in body) t.description = str(body.description, 'descrição', { max: 10000, required: false });
      if ('kind' in body || 'client_id' in body || 'client_visible' in body) {
        const kind = 'kind' in body ? oneOf(body.kind, 'tipo', ['internal', 'external']) : t.kind;
        const cid = kindAndClient(kind, 'client_id' in body ? (body.client_id ? Number(body.client_id) : null) : t.client_id);
        t.client_visible = clientVisible(kind, cid, 'client_visible' in body ? body.client_visible : t.client_visible);
        t.client_id = cid; t.kind = kind;
      }
      if ('start_date' in body) t.start_date = date(body.start_date, 'Início');
      if ('due_date' in body) t.due_date = date(body.due_date, 'Prazo');
      if ('priority' in body) t.priority = oneOf(body.priority, 'prioridade', ['low', 'normal', 'high']);
      if ('alerts' in body) t.alerts = alerts(body.alerts);
      if ('recurrence' in body || 'recurrence_every' in body) { const { rec, every } = recurrence(body, t); t.recurrence = rec; t.recurrence_every = every; }
      if ('progress' in body) {
        const n = Number(body.progress);
        if (!Number.isInteger(n) || n < 0 || n > 100) fail(400, '% de execução deve ser de 0 a 100');
        if (db.checklist.some(i => i.task_id === t.id)) fail(409, 'Esta tarefa tem checklist: o % segue os itens marcados');
        t.progress = n;
      }
      if ('position' in body) t.position = Number(body.position);
      if ('assignee_ids' in body) setAssignees(t.id, checkAssignees(body.assignee_ids));
      if ('status' in body) {
        if (body.status === 'done') fail(400, 'Para concluir, use Concluir e informe a data de término');
        if (body.status === 'cancelled') fail(400, 'Para cancelar, use Cancelar e informe o motivo');
        t.status = oneOf(body.status, 'situação', ['todo', 'doing', 'review']);
        Object.assign(t, { completed_on: null, cancelled_on: null, cancel_reason: null });
        if (t.status !== 'todo' && !('start_date' in body)) t.start_date = t.start_date || S.today();
      }
    } catch (err) { Object.assign(t, copy); throw err; }
    touch(t);
    return detail(user, id);
  });
  route('POST', '/api/tasks/:id/complete', ({ user, body, id }) => {
    requireStaff(user);
    const t = loadTask(user, id);
    const nid = completeTask(t, date(body.completed_on, 'Término') || S.today(), user.id);
    return { ...detail(user, id), created_next_id: nid };
  });
  route('POST', '/api/tasks/:id/cancel', ({ user, body, id }) => {
    requireStaff(user); const t = loadTask(user, id);
    const reason = str(body.reason, 'motivo do cancelamento', { max: 1000 });
    Object.assign(t, { status: 'cancelled', cancel_reason: reason, cancelled_on: S.today(), completed_on: null }); touch(t);
    return detail(user, id);
  });
  route('POST', '/api/tasks/:id/archive', ({ user, body, id }) => {
    requireStaff(user); const t = loadTask(user, id);
    t.archived_at = body.archived === false ? null : now(); return detail(user, id);
  });
  route('DELETE', '/api/tasks/:id', ({ user, id }) => {
    requireAdmin(user); loadTask(user, id);
    db.tasks = db.tasks.filter(t => t.id !== id);
    ['assignees', 'checklist', 'comments', 'adjustments'].forEach(k => { db[k] = db[k].filter(x => x.task_id !== id); });
    return { ok: true };
  });
  route('POST', '/api/tasks/:id/checklist', ({ user, body, id }) => {
    requireStaff(user); const t = loadTask(user, id);
    db.checklist.push({ id: nextId(), task_id: t.id, text: str(body.text, 'item', { max: 300 }), done: 0, position: db.checklist.filter(i => i.task_id === t.id).length });
    touch(t); return detail(user, id);
  });
  const checklistItem = (user, iid) => { const i = db.checklist.find(x => x.id === iid); if (!i) fail(404, 'Item não encontrado'); loadTask(user, i.task_id); return i; };
  route('PATCH', '/api/checklist/:id', ({ user, body, id }) => {
    requireStaff(user); const i = checklistItem(user, id);
    if ('done' in body) i.done = body.done ? 1 : 0;
    if ('text' in body) i.text = str(body.text, 'item', { max: 300 });
    return detail(user, i.task_id);
  });
  route('DELETE', '/api/checklist/:id', ({ user, id }) => {
    requireStaff(user); const i = checklistItem(user, id);
    db.checklist = db.checklist.filter(x => x.id !== id); return detail(user, i.task_id);
  });
  route('POST', '/api/tasks/:id/comments', ({ user, body, id }) => {
    const t = loadTask(user, id);
    db.comments.push({ id: nextId(), task_id: t.id, user_id: user.id, body: str(body.body, 'comentário', { max: 5000 }),
      visible_to_client: user.role === 'client' ? 1 : (S.clientSees(t) && body.visible_to_client ? 1 : 0), created_at: now() });
    touch(t); return detail(user, id);
  });
  route('POST', '/api/tasks/:id/adjustments', ({ user, body, id }) => {
    const t = loadTask(user, id);
    const text = str(body.body, 'o que ajustar', { max: 5000 });
    const origin = user.role === 'client' ? 'client' : 'internal';
    if (origin === 'client' && t.status !== 'review') fail(409, 'Só é possível pedir ajuste quando a tarefa está em revisão');
    if (t.status === 'done') fail(409, 'Reabra a tarefa antes de registrar um ajuste');
    db.adjustments.push({ id: nextId(), task_id: t.id, origin, body: text, user_id: user.id, created_at: now(), resolved_at: null });
    t.status = 'doing'; touch(t); return detail(user, id);
  });
  route('POST', '/api/adjustments/:id/resolve', ({ user, id }) => {
    requireStaff(user);
    const a = db.adjustments.find(x => x.id === id); if (!a) fail(404, 'Ajuste não encontrado');
    loadTask(user, a.task_id); a.resolved_at = a.resolved_at || now(); return detail(user, a.task_id);
  });
  route('POST', '/api/tasks/:id/approve', ({ user, id }) => {
    if (user.role !== 'client') fail(403, 'Só o cliente aprova a entrega');
    const t = loadTask(user, id);
    if (t.status !== 'review') fail(409, 'Esta tarefa não está esperando sua revisão');
    completeTask(t, S.today(), null);
    db.comments.push({ id: nextId(), task_id: t.id, user_id: user.id, body: 'Entrega aprovada.', visible_to_client: 1, created_at: now() });
    return detail(user, id);
  });
  route('GET', '/api/templates', ({ user }) => { requireStaff(user); return db.templates.slice().sort((a, b) => a.name.localeCompare(b.name)); });
  route('POST', '/api/templates', ({ user, body }) => {
    requireStaff(user);
    const id = nextId();
    db.templates.push({ id, name: str(body.name, 'nome', { max: 120 }), title: str(body.title, 'título', { max: 200 }),
      description: str(body.description, 'descrição', { max: 10000, required: false }),
      checklist: (Array.isArray(body.checklist) ? body.checklist : []).map(x => String(x).trim()).filter(Boolean).slice(0, 100) });
    return { id };
  });
  route('DELETE', '/api/templates/:id', ({ user, id }) => { requireStaff(user); db.templates = db.templates.filter(t => t.id !== id); return { ok: true }; });
  route('GET', '/api/report/adjustments', ({ user }) => {
    requireStaff(user);
    const rows = new Map();
    const row = (key, name) => rows.get(key) || rows.set(key, { id: key, name, tasks: 0, internal: 0, client: 0, on_time: 0, late: 0, cancelled: 0 }).get(key);
    db.clients.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach(c => row(c.id, c.name));
    for (const t of list(user, {}).concat(list(user, { archived: '1' }))) {
      const r = row(t.client_id || 'org', t.client_id ? t.client_name : `${db.org.name} (interna)`);
      r.tasks++; r.internal += t.adjustments_internal; r.client += t.adjustments_client;
      if (t.column === 'done_on_time') r.on_time++;
      if (t.column === 'cancelled') r.cancelled++;
      if (t.column === 'done_late') r.late++;
    }
    return [...rows.values()].sort((a, b) => b.client - a.client || b.internal - a.internal || a.name.localeCompare(b.name));
  });

  const realFetch = window.fetch.bind(window);
  window.fetch = async (input, init = {}) => {
    const url = new URL(typeof input === 'string' ? input : input.url, location.href);
    if (!url.pathname.startsWith('/api/')) return realFetch(input, init);
    const method = (init.method || 'GET').toUpperCase();
    const reply = (status, body) => new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } });
    try {
      const r = routes.find(x => x.method === method && x.re.test(url.pathname));
      if (!r) fail(404, 'Rota não encontrada');
      const m = r.re.exec(url.pathname);
      const user = db.users.find(u => u.id === sessionUser && u.active) || null;
      if (!r.pub && !user) fail(401, 'Faça login');
      const out = r.handler({ user, body: init.body ? JSON.parse(init.body) : {}, id: m[1] ? Number(m[1]) : null, query: Object.fromEntries(url.searchParams) });
      persist();
      return reply(200, out);
    } catch (err) {
      if (!err.status) console.error(err);
      return reply(err.status || 500, { error: err.status ? err.message : 'Erro interno' });
    }
  };

  // Barra do protótipo: entrar em cada visão e restaurar os dados.
  window.addEventListener('DOMContentLoaded', () => {
    const bar = document.getElementById('demo-bar');
    const as = async email => {
      document.querySelectorAll('.overlay').forEach(o => o.remove());
      await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: 'demo1234' }) });
      location.hash = '';
      window.boot();
    };
    bar.querySelector('[data-as=admin]').addEventListener('click', () => as('admin@demo.local'));
    bar.querySelector('[data-as=member]').addEventListener('click', () => as('equipe@demo.local'));
    bar.querySelector('[data-as=client]').addEventListener('click', () => as('cliente@demo.local'));
    bar.querySelector('[data-reset]').addEventListener('click', async () => {
      if (!(await window.askConfirm('Apagar tudo o que foi feito neste protótipo e voltar aos dados iniciais?', { ok: 'Restaurar dados', danger: true }))) return;
      try { localStorage.removeItem(KEY); } catch { /* idem */ }
      db = seed(); persist(); location.hash = ''; window.boot();
    });
  });
})();

</script>
<script>
'use strict';
/* global Shared */
const S = window.Shared;

// ---------- utilidades ----------
const state = {
  me: null, org: null, clients: [], users: [], templates: [], alertCount: 0,
  view: { layout: 'kanban', kind: '', client: '', assignee: '', due: '', q: '', group: 'column', archived: false, month: '' },
};
const VIEW_KEY = 'tarefas-visao';
try { Object.assign(state.view, JSON.parse(localStorage.getItem(VIEW_KEY)) || {}, { q: '', archived: false }); } catch { /* sem armazenamento */ }
const saveView = () => { try { localStorage.setItem(VIEW_KEY, JSON.stringify(state.view)); } catch { /* idem */ } };

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v === null || v === undefined) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else if (k === 'checked' || k === 'selected' || k === 'disabled') el[k] = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
    credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/api/login') { state.me = null; renderLogin(); throw new Error('Faça login'); }
  if (!res.ok) throw new Error(data.error || 'Algo deu errado');
  return data;
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}
const guard = fn => async (...args) => { try { await fn(...args); } catch (e) { toast(e.message); } };

const today = () => S.today();
function fmtDate(d) {
  if (!d) return '';
  const [y, m, day] = d.slice(0, 10).split('-');
  return `${day}/${m}/${y}`;
}
const fmtShort = d => (d ? fmtDate(d).slice(0, 5) : '');
function fmtDateTime(s) {
  const d = new Date(s.replace(' ', 'T') + 'Z');
  return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}
const initials = name => name.split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('');
const PRIORITY = { low: 'Baixa', normal: 'Normal', high: 'Alta' };
const isStaff = () => state.me && state.me.role !== 'client';
const isAdmin = () => state.me && state.me.role === 'admin';
const orgShort = () => state.org.name.split(/\s+/)[0];
const roleLabel = r => ({ admin: 'Administrador', member: `Equipe ${orgShort()}`, client: 'Cliente' }[r]);
const colName = key => S.COLUMNS.find(c => c.key === key).name;
const clientById = cid => state.clients.find(c => c.id === cid);
const where = t => (t.client_id ? t.client_name : state.org.name);

// Cor da marca: escolhe texto branco ou preto sobre ela pelo contraste.
function applyAccent(hex) {
  const lum = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  const L = 0.2126 * lum(r) + 0.7152 * lum(g) + 0.0722 * lum(b);
  document.documentElement.style.setProperty('--accent', hex);
  document.documentElement.style.setProperty('--on-accent', (L + 0.05) / 0.05 > 1.05 / (L + 0.05) ? '#000000' : '#ffffff');
}

// Logo da empresa no card: o do cliente, ou o da consultoria nas internas sem cliente.
function logoEl(name, src, size = 'sm') {
  return src
    ? h('img', { class: `logo ${size}`, src, alt: '', title: name })
    : h('span', { class: `logo ${size} fallback`, title: name, 'aria-hidden': 'true' }, initials(name || '?'));
}
const taskLogo = (t, size) => (t.client_id ? logoEl(t.client_name, (clientById(t.client_id) || {}).logo, size) : logoEl(state.org.name, state.org.logo, size));

// Redimensiona a imagem escolhida para 128px e devolve PNG em data URL.
function readLogo(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) { reject(new Error('Escolha um arquivo de imagem')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Não consegui ler a imagem'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Não consegui abrir a imagem'));
      img.onload = () => {
        const size = 128;
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const scale = Math.min(size / img.width, size / img.height);
        const w = img.width * scale, hgt = img.height * scale;
        c.getContext('2d').drawImage(img, (size - w) / 2, (size - hgt) / 2, w, hgt);
        resolve(c.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function logoPicker(label, onPick) {
  const input = h('input', { type: 'file', accept: 'image/*', class: 'sr-only', 'aria-label': label,
    onchange: guard(async e => { const f = e.target.files[0]; e.target.value = ''; if (f) await onPick(await readLogo(f)); }) });
  return h('label', { class: 'btn small file-btn' }, input, label);
}

// ---------- shell ----------
const app = () => document.getElementById('app');

function renderLogin(message) {
  document.title = 'Entrar';
  const err = h('p', { class: 'error', role: 'alert' }, message || '');
  const form = h('form', { class: 'login', onsubmit: async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      await api('POST', '/api/login', { email: fd.get('email'), password: fd.get('password') });
      await boot();
    } catch (ex) { err.textContent = ex.message; }
  } },
    h('h1', {}, 'Entrar'),
    h('p', { class: 'muted' }, 'Acesse com o email e a senha que você recebeu.'),
    h('div', { class: 'field' }, h('label', { for: 'email' }, 'Email'), h('input', { id: 'email', name: 'email', type: 'email', autocomplete: 'username', required: true })),
    h('div', { class: 'field' }, h('label', { for: 'password' }, 'Senha'), h('input', { id: 'password', name: 'password', type: 'password', autocomplete: 'current-password', required: true })),
    err,
    h('button', { class: 'btn primary', type: 'submit' }, 'Entrar'));
  app().replaceChildren(form);
  form.querySelector('input').focus();
}

function shell(content) {
  const nav = isStaff()
    ? [['#/tarefas', 'Tarefas'], ['#/alertas', 'Alertas'], ['#/clientes', 'Clientes'], ['#/modelos', 'Modelos'],
      ['#/relatorio', 'Relatório'], ['#/equipe', 'Pessoas'], ['#/config', 'Configurações']]

async function loadCommon() {
  const me = await api('GET', '/api/me');
  state.me = me.user; state.org = me.org;
  applyAccent(me.org.accent);
  state.clients = await api('GET', '/api/clients');
  if (isStaff()) [state.users, state.templates] = await Promise.all([api('GET', '/api/users'), api('GET', '/api/templates')]);
  await refreshAlerts();
}
async function refreshAlerts() { state.alertCount = (await api('GET', '/api/alerts')).length; }

async function boot() {
  try { await loadCommon(); } catch { renderLogin(); return; }
  route();
}

const ROUTES = {
  '#/tarefas': viewTasks, '#/alertas': viewAlerts, '#/clientes': viewClients, '#/modelos': viewTemplates,
  '#/relatorio': viewReport, '#/equipe': viewTeam, '#/config': viewSettings, '#/portal': viewPortal,
};

async function route() {
  if (!state.me) return;
  const key = location.hash.split('?')[0];
  const fallback = isStaff() ? '#/tarefas' : '#/portal';
  const clientPages = ['#/portal', '#/alertas', '#/config'];
  const view = ROUTES[key];
  if (!view || (isStaff() && key === '#/portal') || (!isStaff() && !clientPages.includes(key))) { location.hash = fallback; return; }
  try { await refreshAlerts(); } catch { /* segue sem o contador */ }
  guard(view)();
}
window.addEventListener('hashchange', route);

function progressBar(p, label = true) {
  return h('div', { class: 'progress', title: `${p}% executado` },
    h('div', { class: 'bar', role: 'progressbar', 'aria-valuenow': p, 'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-label': 'Execução' },
      h('span', { style: `width:${p}%` })),
    label ? h('span', { class: 'pct' }, `${p}%`) : null);
}
function dateRange(t) {
  if (t.status === 'cancelled') return `Cancelada ${fmtShort(t.cancelled_on)}`;
  if (t.status === 'done') return `Término ${fmtShort(t.completed_on)}` + (t.due_date ? ` · prazo ${fmtShort(t.due_date)}` : '');
  if (t.start_date && t.due_date) return `Iniciada ${fmtShort(t.start_date)} · prazo ${fmtShort(t.due_date)}`;
  if (t.due_date) return `Prazo ${fmtShort(t.due_date)}`;
  if (t.start_date) return `Iniciada ${fmtShort(t.start_date)}`;
  return null;
}
// No card, cada data numa etiqueta curta: início (quando começou), prazo, término ou cancelamento.
function dateTags(t) {
  if (t.status === 'cancelled') return h('span', { class: 'tag' }, `Cancelada ${fmtShort(t.cancelled_on)}`);
  if (t.status === 'done') return [h('span', { class: 'tag' }, `Término ${fmtShort(t.completed_on)}`), t.due_date ? h('span', { class: 'tag' }, `Prazo ${fmtShort(t.due_date)}`) : null];
  return [t.start_date ? h('span', { class: 'tag' }, `Início ${fmtShort(t.start_date)}`) : null,
    t.due_date ? h('span', { class: 'tag' + (t.column === 'overdue' ? ' late' : '') }, `Prazo ${fmtShort(t.due_date)}`) : null];
}
const internalTag = t => (t.kind === 'internal' ? h('span', { class: 'tag internal' }, t.client_visible ? 'Interna · cliente vê' : 'Interna') : null);
function taskCard(t, { draggable = false, showStatus = false } = {}) {
  return h('button', { class: `task col-${t.column}`, type: 'button', draggable: draggable ? 'true' : null, 'data-id': t.id, onclick: () => openTask(t.id) },
    h('div', { class: 'task-head' }, taskLogo(t),
      h('div', { class: 'task-who' }, h('span', { class: 'client' }, where(t)),
        internalTag(t))),
    h('div', { class: 'title' }, t.title),

    (t.status === 'doing' || (t.progress > 0 && !['done', 'cancelled'].includes(t.status))) ? progressBar(t.progress) : null,
    h('div', { class: 'meta' },

      dateTags(t),
      t.alert ? h('span', { class: 'tag ' + (t.alert.kind === 'overdue' ? 'late' : 'warn') }, '⏰ ' + S.alertText(t.alert)) : null,
      t.priority === 'high' ? h('span', { class: 'tag high' }, 'Alta') : null,
      t.recurrence !== 'none' ? h('span', { class: 'tag', title: 'Recorrente' }, '↻ ' + S.RECURRENCE[t.recurrence].replace(/ \(.*/, '')) : null,
      t.adjustments_open ? h('span', { class: 'tag adj' }, `${t.adjustments_open} ajuste${t.adjustments_open > 1 ? 's' : ''}`) : null,
      t.checklist_total ? h('span', {}, `☑ ${t.checklist_done}/${t.checklist_total}`) : null,

async function viewTasks() {
  document.title = 'Tarefas';
  const tasks = await api('GET', '/api/tasks?' + taskQuery());

  shell([tasksToolbar(), v.archived ? h('p', { class: 'muted' }, 'Mostrando só as tarefas arquivadas.') : null, body]);
}

function kanbanView(tasks) {
  const board = h('div', { class: 'board' });
  for (const c of S.COLUMNS) {
    const list = tasks.filter(t => t.column === c.key);
    const col = h('section', { class: `col col-${c.key}`, 'aria-label': c.name, 'data-col': c.key },
      h('div', { class: 'col-head' }, h('span', {}, c.name), h('span', { class: 'count' }, list.length)),
      c.key === 'overdue' ? h('p', { class: 'col-note' }, 'Entra sozinha quando o prazo passa') : null,
      list.length ? list.map(t => taskCard(t, { draggable: !state.view.archived })) : h('p', { class: 'empty' }, 'Nada aqui'));
    wireDrop(col, c.key, tasks);
    board.append(col);
  }
  board.addEventListener('dragstart', e => {
    const card = e.target.closest('.task');
    if (!card) return;
    e.dataTransfer.setData('text/plain', card.dataset.id);
    e.dataTransfer.effectAllowed = 'move';
    card.classList.add('dragging');
  });
  board.addEventListener('dragend', e => e.target.closest('.task')?.classList.remove('dragging'));
  return board;
}

function wireDrop(col, key, tasks) {
  col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
  col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('over'); });
  col.addEventListener('drop', guard(async e => {
    e.preventDefault();
    col.classList.remove('over');
    const taskId = Number(e.dataTransfer.getData('text/plain'));
    const task = tasks.find(t => t.id === taskId);
    if (!task || task.column === key) return;
    if (key === 'overdue') { toast('A coluna Atrasada é automática: a tarefa entra nela quando o prazo passa.'); return; }
    if (key === 'done_on_time' || key === 'done_late') { completeDialog(task); return; }
    if (key === 'cancelled') { cancelDialog(task); return; }
    const inCol = tasks.filter(t => t.column === key && t.id !== taskId);
    const target = e.target.closest('.task');
    let position;
    if (target && Number(target.dataset.id) !== taskId) {
      const i = inCol.findIndex(t => t.id === Number(target.dataset.id));
      const prev = inCol[i - 1];
      position = prev ? (prev.position + inCol[i].position) / 2 : inCol[i].position - 1;
    } else position = inCol.length ? inCol[inCol.length - 1].position + 1 : 1;
    const nt = await api('PATCH', `/api/tasks/${taskId}`, { status: key, position });
    if (nt.column === 'overdue') toast(`Mudou para ${S.STATUS_LABEL[key]}, mas continua em Atrasada porque o prazo já passou.`);
    route();
  }));
}

function groupKey(t, group) {
  const now = today();
  if (group === 'column') return [S.COLUMNS.findIndex(c => c.key === t.column), colName(t.column)];
  if (group === 'client') return [t.client_id ? 1 : 0, where(t)];
  if (group === 'kind') return [t.kind === 'external' ? 0 : 1, t.kind === 'external' ? 'Externas' : 'Internas'];
  if (group === 'due') {
    if (t.status === 'cancelled') return [5, 'Canceladas'];
    if (t.status === 'done') return [4, 'Concluídas'];
    if (!t.due_date) return [6, 'Sem prazo'];
    if (t.due_date < now) return [0, 'Atrasadas'];
    if (t.due_date === now) return [1, 'Vencem hoje'];
    if (t.due_date <= S.addDays(now, 7)) return [2, 'Próximos 7 dias'];
    return [3, 'Mais adiante'];
  }
  return null;
}

function listView(tasks) {
  if (!tasks.length) return h('div', { class: 'card-box empty' }, 'Nenhuma tarefa com esses filtros.');
  const group = state.view.group;
  const groups = new Map();
  const add = (k, label, t) => { if (!groups.has(label)) groups.set(label, { k, label, items: [] }); groups.get(label).items.push(t); };
  for (const t of tasks) {
    if (group === 'assignee') {
      if (!t.assignees.length) add('~', 'Sem responsável', t);
      for (const a of t.assignees) add(a.name, a.name, t);
    } else { const [k, label] = groupKey(t, group); add(typeof k === 'number' ? String(k).padStart(3, '0') + label : k, label, t); }
  }
  const sorted = [...groups.values()].sort((a, b) => String(a.k).localeCompare(String(b.k)));
  return sorted.map(g => h('div', { class: 'card-box' },
    h('h2', {}, `${g.label} (${g.items.length})`),
    h('div', { class: 'table-wrap' }, h('table', { class: 'tasks' },
      h('thead', {}, h('tr', {}, ['Tarefa', 'Empresa', 'Responsáveis', 'Início', 'Prazo', 'Situação', 'Execução'].map(x => h('th', {}, x)))),
      h('tbody', {}, g.items.sort((a, b) => (a.due_date || '9999').localeCompare(b.due_date || '9999')).map(t => h('tr', { class: 'row-link', onclick: () => openTask(t.id) },
        h('td', {}, h('button', { class: 'link', type: 'button', onclick: e => { e.stopPropagation(); openTask(t.id); } }, t.title),
          t.alert ? h('div', { class: 'small ' + (t.alert.kind === 'overdue' ? 'danger' : 'warn') }, '⏰ ' + S.alertText(t.alert)) : null),
        h('td', {}, h('span', { class: 'with-logo' }, taskLogo(t), where(t)), internalTag(t)),
        h('td', {}, t.assignees.map(a => a.name).join(', ') || '–'),
        h('td', { class: 'num' }, fmtDate(t.start_date) || '–'),
        h('td', { class: 'num' }, fmtDate(t.due_date) || '–'),
        h('td', {}, h('span', { class: `pill col-${t.column}` }, colName(t.column))),
        h('td', {}, progressBar(t.progress)))))))));
}

const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
function calendarView(tasks) {
  const v = state.view;
  const month = v.month || today().slice(0, 7);
  const [y, m] = month.split('-').map(Number);
  const first = `${month}-01`;
  const startDow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
  const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const shift = n => { const d = S.addMonths(first, n).slice(0, 7); v.month = d; saveView(); route(); };
  const byDay = new Map();
  for (const t of tasks) if (t.due_date && t.due_date.startsWith(month)) (byDay.get(t.due_date) || byDay.set(t.due_date, []).get(t.due_date)).push(t);
  const noDue = tasks.filter(t => !t.due_date);
  const chip = t => h('button', { type: 'button', class: `chip col-${t.column}`, onclick: () => openTask(t.id), title: `${t.title} · ${where(t)} · ${colName(t.column)}` },
    taskLogo(t, 'xs'), h('span', {}, t.title));
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(h('div', { class: 'cal-cell out', 'aria-hidden': 'true' }));
  for (let d = 1; d <= days; d++) {
    const iso = `${month}-${String(d).padStart(2, '0')}`;
    const list = byDay.get(iso) || [];
    cells.push(h('div', { class: 'cal-cell' + (iso === today() ? ' today' : '') },
      h('div', { class: 'cal-day' }, d), list.map(chip)));
  }
  const agenda = [...byDay.keys()].sort().map(day => h('div', { class: 'agenda-day' + (day === today() ? ' today' : '') },
    h('h3', {}, new Date(day + 'T12:00').toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' })),
    byDay.get(day).map(chip)));
  return h('div', { class: 'card-box calendar' },
    h('div', { class: 'cal-nav' },
      h('button', { class: 'btn small', type: 'button', onclick: () => shift(-1), 'aria-label': 'Mês anterior' }, '‹'),
      h('h2', {}, `${MONTHS[m - 1][0].toUpperCase()}${MONTHS[m - 1].slice(1)} de ${y}`),
      h('button', { class: 'btn small', type: 'button', onclick: () => shift(1), 'aria-label': 'Próximo mês' }, '›'),
      h('button', { class: 'btn small', type: 'button', onclick: () => { v.month = ''; saveView(); route(); } }, 'Hoje'),
      h('span', { class: 'muted small' }, 'Tarefas no dia do prazo')),
    h('div', { class: 'cal-grid' },
      ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map(d => h('div', { class: 'cal-dow' }, d)), cells),
    h('div', { class: 'agenda' }, agenda.length ? agenda : h('p', { class: 'muted' }, 'Nenhum prazo neste mês.')),
    noDue.length ? h('details', { class: 'no-due' }, h('summary', {}, `Sem prazo (${noDue.length})`), h('div', { class: 'chips' }, noDue.map(chip))) : null);
}

// ---------- diálogos ----------
function modal(content, { onclose } = {}) {
  const close = () => { overlay.remove(); document.removeEventListener('keydown', esc, true); onclose && onclose(); };
  const esc = e => { if (e.key === 'Escape') { e.stopImmediatePropagation(); close(); } };
  const overlay = h('div', { class: 'overlay center', onclick: e => { if (e.target === overlay) close(); } },
    h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' }, content(close)));
  document.addEventListener('keydown', esc, true);
  document.body.append(overlay);
  overlay.querySelector('input, select, textarea, button')?.focus();
  return close;
}

// Confirmações dentro da página (algumas telas onde o app roda não mostram confirm() nem prompt()).
function ask(message, { ok = 'Confirmar', danger = false } = {}) {
  return new Promise(resolve => {
    modal(close => h('div', {},
      h('p', { class: 'confirm-text' }, message),
      h('div', { class: 'row' },
        h('button', { class: 'btn ' + (danger ? 'danger' : 'primary'), type: 'button', onclick: () => { resolve(true); close(); } }, ok),
        h('button', { class: 'btn', type: 'button', onclick: () => close() }, 'Cancelar'))),
    { onclose: () => resolve(false) });
  });
}
function askText(label, value = '') {
  return new Promise(resolve => {
    modal(close => {
      const input = h('input', { id: 'ask-text', value, maxlength: 120, required: true });
      return h('form', { onsubmit: e => { e.preventDefault(); resolve(input.value.trim() || null); close(); } },
        h('div', { class: 'field' }, h('label', { for: 'ask-text' }, label), input),
        h('div', { class: 'row' },
          h('button', { class: 'btn primary', type: 'submit' }, 'Salvar'),
          h('button', { class: 'btn', type: 'button', onclick: () => close() }, 'Cancelar')));
    }, { onclose: () => resolve(null) });
  });
}
window.askConfirm = ask;

// Concluir: pede a data de término e mostra em qual coluna a tarefa vai cair.
function completeDialog(t, after) {
  modal(close => {
    const err = h('p', { class: 'error', role: 'alert' });
    const result = h('p', { class: 'muted' });
    const input = h('input', { id: 'c-date', type: 'date', value: today(), max: today(), required: true });
    const preview = () => {
      const col = S.column({ status: 'done', due_date: t.due_date, completed_on: input.value }, today());
      result.replaceChildren('Vai para: ', h('span', { class: `pill col-${col}` }, colName(col)),
        t.due_date ? ` (prazo ${fmtDate(t.due_date)})` : ' (sem prazo definido)');
    };
    input.addEventListener('input', preview);
    preview();
    return h('form', { onsubmit: async e => {
      e.preventDefault();
      try {
        const nt = await api('POST', `/api/tasks/${t.id}/complete`, { completed_on: input.value });
        close();
        toast(nt.created_next_id ? `Concluída. A próxima (${S.RECURRENCE[t.recurrence].replace(/ \(.*/, '').toLowerCase()}) já foi criada.` : 'Tarefa concluída');
        after ? after(nt) : route();
      } catch (ex) { err.textContent = ex.message; }
    } },
      h('h2', {}, 'Concluir tarefa'),
      h('p', {}, t.title),
      h('div', { class: 'field' }, h('label', { for: 'c-date' }, 'Data de término'), input),
      result,
      t.recurrence !== 'none' ? h('p', { class: 'muted small' }, `Esta tarefa repete (${S.RECURRENCE[t.recurrence]}). Ao concluir, a próxima é criada com as datas avançadas.`) : null,
      err,
      h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'submit' }, 'Concluir'),

// Cancelar: o motivo é obrigatório e fica registrado na tarefa.
function cancelDialog(t, after) {
  modal(close => {
    const err = h('p', { class: 'error', role: 'alert' });
    const ta = h('textarea', { id: 'x-reason', required: true, maxlength: 1000, placeholder: 'Por que esta tarefa não vai mais ser feita?' });
    return h('form', { onsubmit: async e => {
      e.preventDefault();
      if (!ta.value.trim()) { err.textContent = 'Escreva o motivo do cancelamento.'; ta.focus(); return; }
      try {
        const nt = await api('POST', `/api/tasks/${t.id}/cancel`, { reason: ta.value });
        close(); toast('Tarefa cancelada');
        after ? after(nt) : route();
      } catch (ex) { err.textContent = ex.message; }
    } },
      h('h2', {}, 'Cancelar tarefa'),
      h('p', {}, t.title),
      h('div', { class: 'field' }, h('label', { for: 'x-reason' }, 'Motivo do cancelamento'), ta),
      t.client_visible ? h('p', { class: 'muted small' }, 'O cliente vê esta tarefa e vai ver o motivo.') : null,
      t.recurrence !== 'none' ? h('p', { class: 'muted small' }, 'Cancelar não cria a próxima repetição.') : null,
      err,
      h('div', { class: 'row' }, h('button', { class: 'btn danger', type: 'submit' }, 'Cancelar tarefa'),
        h('button', { class: 'btn', type: 'button', onclick: close }, 'Voltar')));
  });
}

// ---------- campos de tarefa (nova e detalhe) ----------
function staffUsers() { return state.users.filter(u => u.role !== 'client' && u.active); }
function assigneeChecks(selected = []) {

    staffUsers().map(u => h('label', {}, h('input', { type: 'checkbox', name: 'assignee', value: u.id, checked: selected.includes(u.id) }), u.name)));
}
function alertChecks(selected = []) {
  return h('div', { class: 'checks', role: 'group', 'aria-label': 'Alertas' },
    S.ALERTS.map(a => h('label', {}, h('input', { type: 'checkbox', name: 'alert', value: a.days, checked: selected.includes(a.days) }), a.label)));
